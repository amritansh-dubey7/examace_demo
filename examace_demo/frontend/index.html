<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ExamAce — AI-Powered Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07070e;--surface:#0f0f1a;--surface2:#16162a;--surface3:#1e1e35;
  --border:#ffffff0f;--border2:#ffffff1a;
  --text:#f0f0ff;--muted:#8888aa;--subtle:#444466;
  --brand:#7c6af5;--brand2:#a78bfa;--brand-glow:#7c6af533;
  --green:#22d3a0;--red:#f87171;--amber:#fbbf24;--blue:#60a5fa;--pink:#f472b6;
  --r:12px;--r2:20px;--r3:28px;
  --trans:all .2s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
h1,h2,h3,h4{font-family:'Syne',sans-serif;}
code,pre{font-family:'JetBrains Mono',monospace;}

/* Layout */
.app{display:flex;min-height:100vh;}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:var(--trans);}
.main{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:50;}
.content{padding:2rem;flex:1;}

/* Sidebar */
.logo{padding:1.5rem 1.25rem;display:flex;align-items:center;gap:.75rem;border-bottom:1px solid var(--border);}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--brand),var(--brand2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;background:linear-gradient(135deg,#fff,var(--brand2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav{padding:1rem .75rem;flex:1;display:flex;flex-direction:column;gap:.25rem;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .75rem;border-radius:var(--r);cursor:pointer;transition:var(--trans);font-size:.875rem;color:var(--muted);font-weight:500;text-decoration:none;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--brand-glow);color:var(--brand2);border:1px solid var(--brand)33;}
.nav-item .icon{font-size:1.1rem;width:20px;text-align:center;}
.sidebar-footer{padding:1rem .75rem;border-top:1px solid var(--border);}
.student-pill{display:flex;align-items:center;gap:.75rem;padding:.65rem .75rem;border-radius:var(--r);background:var(--surface2);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--pink));display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;font-family:'Syne',sans-serif;flex-shrink:0;}
.student-info{min-width:0;}
.student-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.student-exam{font-size:.7rem;color:var(--muted);}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;opacity:.06;background:var(--accent-color,var(--brand));}
.stat-number{font-family:'Syne',sans-serif;font-size:2.25rem;font-weight:800;line-height:1;}
.stat-label{font-size:.8rem;color:var(--muted);margin-top:.35rem;font-weight:500;}
.stat-badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;padding:.2rem .5rem;border-radius:20px;margin-top:.5rem;font-weight:600;}
.badge-green{background:#22d3a020;color:var(--green);}
.badge-red{background:#f8717120;color:var(--red);}
.badge-amber{background:#fbbf2420;color:var(--amber);}
.badge-brand{background:var(--brand-glow);color:var(--brand2);}

/* Grid */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.6rem 1.25rem;border-radius:var(--r);font-size:.875rem;font-weight:600;cursor:pointer;transition:var(--trans);border:none;font-family:'DM Sans',sans-serif;}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.btn-danger{background:#f8717120;color:var(--red);border:1px solid #f8717133;}
.btn-sm{padding:.4rem .85rem;font-size:.8rem;}
.btn-green{background:#22d3a020;color:var(--green);border:1px solid #22d3a033;}

/* Form */
.form-group{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem;}
label{font-size:.8rem;font-weight:600;color:var(--muted);}
input,select,textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:.65rem .9rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.875rem;transition:var(--trans);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-glow);}
select option{background:var(--surface2);}
textarea{resize:vertical;min-height:80px;}

/* Progress */
.progress-bar{background:var(--surface3);border-radius:20px;height:6px;overflow:hidden;}
.progress-fill{height:100%;border-radius:20px;transition:width .5s cubic-bezier(.4,0,.2,1);}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .6rem;border-radius:20px;font-size:.72rem;font-weight:600;}

/* Table */
.table{width:100%;border-collapse:separate;border-spacing:0;}
.table th{text-align:left;padding:.75rem 1rem;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);}
.table td{padding:.75rem 1rem;font-size:.875rem;border-bottom:1px solid var(--border);}
.table tr:last-child td{border-bottom:none;}
.table tbody tr:hover{background:var(--surface2);}

/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.section-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;}

/* Chat */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 160px);}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.75rem;padding:.5rem 0;}
.msg{display:flex;gap:.75rem;max-width:80%;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-bubble{padding:.85rem 1.1rem;border-radius:var(--r2);font-size:.9rem;line-height:1.6;}
.msg.ai .msg-bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg.user .msg-bubble{background:linear-gradient(135deg,var(--brand),var(--brand2));border-bottom-right-radius:4px;}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;}
.msg.ai .msg-avatar{background:var(--surface3);border:1px solid var(--border2);}
.msg.user .msg-avatar{background:linear-gradient(135deg,var(--brand),var(--pink));}
.chat-input-row{display:flex;gap:.75rem;padding-top:.75rem;border-top:1px solid var(--border);}
.chat-input-row input{flex:1;}
.typing{display:flex;gap:.3rem;align-items:center;padding:.5rem .75rem;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce .8s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.15s;}
.dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
@keyframes fadeInSlide{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:none;}}

/* Planner */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem;}
.cal-day{aspect-ratio:1;border-radius:var(--r);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem;cursor:pointer;transition:var(--trans);padding:.25rem;}
.cal-day:hover{border-color:var(--brand);background:var(--brand-glow);}
.cal-day.today{border-color:var(--brand2);background:var(--brand-glow);color:var(--brand2);font-weight:700;}
.cal-day.has-plan{background:var(--surface2);}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--brand2);margin-top:2px;}

/* Weak topic */
.weak-item{display:flex;align-items:center;gap:1rem;padding:.85rem 1rem;background:var(--surface2);border-radius:var(--r);border:1px solid var(--border);}
.weak-icon{width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:#f8717120;}

/* Onboarding */
.onboard-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg);}
.onboard-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r3);padding:2.5rem;width:100%;max-width:480px;position:relative;overflow:hidden;}
.onboard-card::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:var(--brand);opacity:.05;}
.onboard-title{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:.5rem;background:linear-gradient(135deg,#fff,var(--brand2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.exam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin:.5rem 0 1rem;}
.exam-opt{border:2px solid var(--border2);border-radius:var(--r);padding:1rem .5rem;cursor:pointer;transition:var(--trans);text-align:center;background:var(--surface2);}
.exam-opt:hover{border-color:var(--brand);}
.exam-opt.selected{border-color:var(--brand2);background:var(--brand-glow);}
.exam-opt .em{font-size:1.8rem;display:block;margin-bottom:.35rem;}
.exam-opt .et{font-size:.8rem;font-weight:700;font-family:'Syne',sans-serif;}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--subtle);border-radius:4px;}

/* Page transitions */
.page{animation:fadein .2s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* Glow effects */
.glow-brand{box-shadow:0 0 24px var(--brand-glow);}

/* Responsive */
@media(max-width:900px){
  .grid-4,.grid-3{grid-template-columns:repeat(2,1fr);}
  .sidebar{width:60px;}
  .sidebar .logo-text,.sidebar .nav-item span,.sidebar .student-info{display:none;}
  .main{margin-left:60px;}
}
@media(max-width:600px){
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  .main{margin-left:0;}
  .sidebar{display:none;}
}

/* Chart containers */
.chart-wrap{position:relative;height:220px;}
.chart-wrap-tall{position:relative;height:300px;}

/* Misc */
.flex{display:flex;}.flex-col{flex-direction:column;}.items-center{align-items:center;}.gap-1{gap:.5rem;}.gap-2{gap:1rem;}.gap-3{gap:1.5rem;}.justify-between{justify-content:space-between;}.flex-1{flex:1;}.mt-1{margin-top:.5rem;}.mt-2{margin-top:1rem;}.mt-3{margin-top:1.5rem;}.mb-2{margin-bottom:1rem;}.w-full{width:100%;}.text-muted{color:var(--muted);}.text-sm{font-size:.875rem;}.text-xs{font-size:.75rem;}.font-bold{font-weight:700;}.rounded{border-radius:var(--r);}.p-3{padding:1.5rem;}.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--brand2);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:3rem;color:var(--muted);}
.empty-state .em{font-size:3rem;margin-bottom:1rem;}

/* Phase 2: Pre-test / submit modals */
.modal-overlay{position:fixed;inset:0;background:#000000a0;backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);padding:2rem;max-width:440px;width:100%;}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1.25rem;margin-bottom:.35rem;}
.energy-grid{display:flex;gap:.5rem;justify-content:space-between;margin:1.25rem 0;}
.energy-opt{flex:1;text-align:center;padding:.85rem .25rem;border-radius:var(--r);border:1px solid var(--border2);cursor:pointer;transition:var(--trans);background:var(--surface2);font-size:1.4rem;}
.energy-opt:hover{border-color:var(--brand);}
.energy-opt.selected{border-color:var(--brand);background:var(--brand-glow);box-shadow:0 0 0 1px var(--brand);}
.feeling-grid{display:flex;gap:.5rem;margin:1rem 0;}
.feeling-opt{flex:1;text-align:center;padding:.65rem;border-radius:var(--r);border:1px solid var(--border2);cursor:pointer;background:var(--surface2);font-size:.85rem;font-weight:600;}
.feeling-opt.selected{border-color:var(--brand);background:var(--brand-glow);color:var(--brand2);}
.review-stat-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.9rem;}
.review-stat-row:last-child{border-bottom:none;}

/* Phase 2: Live test interface */
.test-shell{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;}
.test-topbar{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;}
.test-section-tabs{display:flex;gap:.4rem;flex-wrap:wrap;}
.test-section-tab{padding:.4rem .8rem;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;color:var(--muted);}
.test-section-tab.active{background:var(--brand-glow);color:var(--brand2);border-color:var(--brand);}
.test-timer{font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;padding:.3rem .75rem;border-radius:var(--r);background:var(--surface2);margin-left:auto;}
.test-timer.amber{color:var(--amber);background:#fbbf2415;}
.test-timer.red{color:var(--red);background:#f8717115;animation:pulse-red 1.5s infinite;}
@keyframes pulse-red{0%,100%{opacity:1;}50%{opacity:.6;}}
.test-body{flex:1;display:flex;overflow:hidden;}
.test-navgrid-panel{width:280px;border-right:1px solid var(--border);background:var(--surface);padding:1rem;overflow-y:auto;flex-shrink:0;}
.qnav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;margin-bottom:1rem;}
.qnav-btn{aspect-ratio:1;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:.75rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;}
.qnav-btn.answered{background:var(--green);border-color:var(--green);color:#06251c;}
.qnav-btn.visited{background:#fbbf2440;border-color:var(--amber);}
.qnav-btn.current{outline:2px solid var(--brand2);outline-offset:1px;}
.qnav-btn.flagged::after{content:'⚑';position:absolute;top:-7px;right:-5px;font-size:.7rem;}
.qnav-legend{display:flex;flex-direction:column;gap:.4rem;font-size:.75rem;color:var(--muted);}
.qnav-legend-item{display:flex;align-items:center;gap:.5rem;}
.qnav-legend-swatch{width:14px;height:14px;border-radius:4px;border:1px solid var(--border2);flex-shrink:0;}
.test-question-panel{flex:1;overflow-y:auto;padding:1.5rem 2rem;max-width:800px;}
.test-q-meta{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap;}
.test-q-text{font-size:1.05rem;line-height:1.6;margin-bottom:1.5rem;white-space:pre-wrap;}
.test-option{display:flex;align-items:flex-start;gap:.75rem;padding:.9rem 1rem;border-radius:var(--r);border:1px solid var(--border2);margin-bottom:.6rem;cursor:pointer;transition:var(--trans);background:var(--surface2);}
.test-option:hover{border-color:var(--brand);}
.test-option.selected{border-color:var(--brand);background:var(--brand-glow);}
.test-option-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--subtle);flex-shrink:0;margin-top:.1rem;display:flex;align-items:center;justify-content:center;}
.test-option.selected .test-option-radio{border-color:var(--brand2);}
.test-option.selected .test-option-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--brand2);}
.test-option-checkbox{width:20px;height:20px;border-radius:5px;border:2px solid var(--subtle);flex-shrink:0;margin-top:.1rem;display:flex;align-items:center;justify-content:center;}
.test-option.selected .test-option-checkbox{border-color:var(--brand2);background:var(--brand-glow);}
.test-option.selected .test-option-checkbox::after{content:'✓';color:var(--brand2);font-size:.8rem;font-weight:700;}
.test-integer-input{width:160px;padding:.75rem 1rem;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:1rem;}
.confidence-row{display:flex;gap:.5rem;margin:1.25rem 0;}
.confidence-btn{flex:1;padding:.6rem;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface2);cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted);}
.confidence-btn.selected-sure{border-color:var(--green);background:#22d3a020;color:var(--green);}
.confidence-btn.selected-unsure{border-color:var(--amber);background:#fbbf2420;color:var(--amber);}
.confidence-btn.selected-guessing{border-color:var(--red);background:#f8717120;color:var(--red);}
.test-footer-nav{display:flex;gap:.6rem;padding:1rem 2rem;border-top:1px solid var(--border);background:var(--surface);}
@media(max-width:900px){
  .test-navgrid-panel{position:fixed;left:0;top:48px;bottom:0;transform:translateX(-100%);transition:var(--trans);z-index:50;box-shadow:8px 0 24px #0008;}
  .test-navgrid-panel.open{transform:translateX(0);}
  .test-question-panel{padding:1rem;}
  .test-footer-nav{padding:.75rem 1rem;flex-wrap:wrap;}
}
</style>

<body>
<div id="root"></div>
<script type="module">
// ── CONFIG ───────────────────────────────────────────────────────────────────
const API = location.protocol.startsWith('http') && ['8000', ''].includes(location.port)
  ? location.origin
  : 'http://localhost:8000';

// ── EVENT MANAGER (Phase 2: live test behavioral capture) ─────────────────────
const EventManager = {
  sessionId: null,
  queue: [],
  flushTimer: null,
  currentQuestionId: null,
  questionEnterTime: null,
  answerState: {},
  confidenceState: {},
  backgroundStart: null,
  totalBackgroundMs: 0,
  FLUSH_INTERVAL_MS: 20000,

  init(sessionId) {
    this.sessionId = sessionId;
    this.queue = [];
    this.answerState = {};
    this.confidenceState = {};
    this.totalBackgroundMs = 0;
    this.currentQuestionId = null;
    this.questionEnterTime = null;
    this.backgroundStart = null;
    if (this.flushTimer) clearInterval(this.flushTimer);
    this.flushTimer = setInterval(() => this.flush(), this.FLUSH_INTERVAL_MS);
    this._visibilityHandler = () => {
      if (document.hidden) {
        this.backgroundStart = Date.now();
        this.push('AppBackgrounded', {});
      } else {
        if (this.backgroundStart) {
          this.totalBackgroundMs += Date.now() - this.backgroundStart;
          this.backgroundStart = null;
        }
        this.push('AppForegrounded', {});
      }
    };
    document.addEventListener('visibilitychange', this._visibilityHandler);
    this._unloadHandler = () => this.flushSync();
    window.addEventListener('beforeunload', this._unloadHandler);
  },

  push(eventType, data = {}) {
    if (!this.sessionId) return;
    this.queue.push({
      event_type: eventType,
      event_data: data,
      occurred_at: Date.now(),
      question_id: data.question_id || null
    });
  },

  onQuestionView(questionId) {
    const now = Date.now();
    if (this.currentQuestionId && this.questionEnterTime) {
      const rawTime = now - this.questionEnterTime;
      const bgAdjustedTime = Math.max(0, rawTime - this.totalBackgroundMs);
      this.totalBackgroundMs = 0;
      this.push('QuestionLeft', {
        question_id: this.currentQuestionId,
        time_spent_ms: bgAdjustedTime
      });
    }
    this.currentQuestionId = questionId;
    this.questionEnterTime = now;
    const wasAnswered = !!this.answerState[questionId];
    this.push(wasAnswered ? 'QuestionRevisited' : 'QuestionViewed', {question_id: questionId});
  },

  onAnswerSelect(questionId, answer) {
    const old = this.answerState[questionId] || null;
    if (old === null) {
      this.push('AnswerSelected', {question_id: questionId, answer});
    } else if (old !== answer) {
      this.push('AnswerChanged', {question_id: questionId, old_answer: old, new_answer: answer});
    }
    this.answerState[questionId] = answer;
  },

  onConfidenceRate(questionId, rating) {
    this.confidenceState[questionId] = rating;
    this.push('ConfidenceRated', {question_id: questionId, rating});
  },

  onAnswerClear(questionId) {
    this.push('AnswerCleared', {question_id: questionId, had_answer: this.answerState[questionId] || null});
    delete this.answerState[questionId];
    delete this.confidenceState[questionId];
  },

  onSkip(questionId) {
    this.push('QuestionSkipped', {question_id: questionId});
  },

  onFlag(questionId, flagged) {
    this.push('QuestionFlagged', {question_id: questionId, flagged});
  },

  onSectionChange(from, to) {
    if (this.currentQuestionId && this.questionEnterTime) {
      const rawTime = Date.now() - this.questionEnterTime;
      const bgAdjustedTime = Math.max(0, rawTime - this.totalBackgroundMs);
      this.totalBackgroundMs = 0;
      this.push('QuestionLeft', {question_id: this.currentQuestionId, time_spent_ms: bgAdjustedTime});
      this.currentQuestionId = null;
      this.questionEnterTime = null;
    }
    this.push('SectionChanged', {from_section: from, to_section: to});
  },

  async onSubmit(finalAnswers) {
    if (this.currentQuestionId && this.questionEnterTime) {
      if (this.backgroundStart) {
        this.totalBackgroundMs += Date.now() - this.backgroundStart;
        this.backgroundStart = null;
      }
      const rawTime = Date.now() - this.questionEnterTime;
      const bgAdjustedTime = Math.max(0, rawTime - this.totalBackgroundMs);
      this.push('QuestionLeft', {question_id: this.currentQuestionId, time_spent_ms: bgAdjustedTime});
      this.currentQuestionId = null;
      this.questionEnterTime = null;
    }
    this.push('TestSubmitted', {final_answers: finalAnswers, confidence_state: this.confidenceState});
    clearInterval(this.flushTimer);
    await this.flush();
  },

  async flush() {
    if (!this.queue.length || !this.sessionId) return;
    const batch = [...this.queue];
    this.queue = [];
    try {
      await fetch(`${API}/api/sessions/${this.sessionId}/events`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({events: batch})
      });
    } catch(e) {
      this.queue = [...batch, ...this.queue];
      console.warn('EventManager: flush failed, events requeued', e);
    }
  },

  flushSync() {
    if (this.currentQuestionId && this.questionEnterTime) {
      if (this.backgroundStart) {
        this.totalBackgroundMs += Date.now() - this.backgroundStart;
        this.backgroundStart = null;
      }
      const rawTime = Date.now() - this.questionEnterTime;
      const bgAdjustedTime = Math.max(0, rawTime - this.totalBackgroundMs);
      this.push('QuestionLeft', {question_id: this.currentQuestionId, time_spent_ms: bgAdjustedTime});
      this.currentQuestionId = null;
      this.questionEnterTime = null;
    }
    if (!this.queue.length || !this.sessionId) return;
    navigator.sendBeacon(
      `${API}/api/sessions/${this.sessionId}/events`,
      new Blob([JSON.stringify({events: this.queue})], {type: 'application/json'})
    );
  },

  destroy() {
    clearInterval(this.flushTimer);
    if (this._visibilityHandler) document.removeEventListener('visibilitychange', this._visibilityHandler);
    if (this._unloadHandler) window.removeEventListener('beforeunload', this._unloadHandler);
    this.sessionId = null;
    this.queue = [];
    this.currentQuestionId = null;
    this.questionEnterTime = null;
  }
};

// ── API HELPERS ──────────────────────────────────────────────────────────────
async function api(path, opts={}) {
  try {
    const r = await fetch(API+path, {headers:{'Content-Type':'application/json'},...opts});
    const data = await r.json();
    if(!r.ok) {
      const msg = Array.isArray(data.detail) ? data.detail.map(d=>d.msg).join(', ') : (data.detail || 'Request failed');
      throw new Error(msg);
    }
    return data;
  } catch(e) {
    const msg = e instanceof TypeError
      ? `Could not reach the backend at ${API}. Start the backend first, then open http://localhost:8000/static/index.html.`
      : (e.message || 'Could not connect to the server.');
    alert(msg);
    return null;
  }
}
async function post(path, body) {
  return api(path, {method:'POST', body: JSON.stringify(body)});
}
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}
function nl2br(value) {
  return esc(value).replace(/\n/g, '<br/>');
}

  const lastEntry = scoreHistory[scoreHistory.length - 1] || null;
  const lastLeakage = lastEntry ? (ri?.leakage_by_type?.reduce((a,b) => a + b.avg_marks_per_test, 0) || 0) : 0;

  if (level < 2) {
    section2 = buildLockCard(2, n, 'Rank Leakage Breakdown');
    section2 = `<div class="mb-2">${section2}</div>`;
  } else {
    const totalLeaked = rls.avg_leaked_per_test || 0;
    const topLeakSrc = rls.top_leakage_source || '';
    const fix1ActionMap = {
      conceptual: 'Revise the underlying theory, not more practice problems. Use your mistake log to find which chapters.',
      calculation: 'Practice 10 calculation-heavy problems daily with a focus on step verification before moving on.',
      time_pressure: 'Practice pacing: set a 2-min hard limit per question in your next mock. Move on when it hits.',
      guessing: 'Mark questions you are unsure about with a flag. Review flagged Qs last — don\'t guess mid-test.',
      avoidance: 'Pick 3 chapters you avoid. Spend 20 mins each day on them before anything else.',
      careless: 'Write down each step. Careless errors drop dramatically when work is visible on paper.',
    };
    const fix1Action = fix1ActionMap[topLeakSrc] || 'Focus on your highest leakage source first.';
    const maxLeaked = leakageByType.reduce((m,i) => Math.max(m, i.avg_marks_per_test), 1);

    section2 = `
      <div class="card mb-2">
        <div class="text-xs font-bold text-muted mb-3" style="text-transform:uppercase;letter-spacing:.06em">⚡ Rank Leakage — Average per Test</div>
        ${leakageByType.length > 0 ? `
          <div style="display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.25rem">
            ${leakageByType.map(item => {
              const col = MISTAKE_COLORS[item.mistake_type] || '#94a3b8';
              const label = MISTAKE_TYPE_LABELS[item.mistake_type] || item.mistake_type;
              const barPct = maxLeaked > 0 ? (item.avg_marks_per_test / maxLeaked) * 100 : 0;
              return `<div class="flex items-center gap-2">
                <div style="width:130px;font-size:.78rem;color:var(--text2);flex-shrink:0">${esc(label)}</div>
                <div style="flex:1;background:var(--border);border-radius:4px;height:10px">
                  <div style="height:10px;border-radius:4px;background:${col};width:${barPct.toFixed(0)}%;transition:width .5s"></div>
                </div>
                <div style="width:45px;text-align:right;font-size:.8rem;font-weight:700;color:${col}">${item.avg_marks_per_test?.toFixed(1)}</div>
                <div class="text-xs text-muted" style="width:35px">${item.count}×</div>
              </div>`;
            }).join('')}
          </div>
          ${topLeakSrc ? `
            <div style="background:var(--brand-glow);border:1px solid var(--brand);border-radius:10px;padding:1rem">
              <div class="text-xs font-bold" style="color:var(--brand2);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em">🎯 Fix This First</div>
              <div class="text-sm font-bold mb-1" style="text-transform:capitalize">${esc(topLeakSrc.replace('_',' '))} errors — costing you ${totalLeaked.toFixed(1)} marks/test on average</div>
              <div class="text-sm text-muted mb-2">${esc(fix1Action)}</div>
              <button class="btn btn-sm" style="background:var(--brand);color:#fff" onclick="askMentorWith('My top rank leakage source is ${topLeakSrc}. I lose about ${totalLeaked.toFixed(1)} marks per test to it. How do I fix this specifically?')">Ask mentor how to fix this →</button>
            </div>
          ` : ''}
        ` : '<div class="empty-state" style="padding:1.5rem;text-align:center;color:var(--text2)">No leakage data yet — complete a live test for the pipeline to analyze</div>'}
      </div>`;
  }

  // ── SECTION 3: Behavioral Flags (level 2+) ────────────────────────────────
  let section3 = '';
  if (level < 2) {
    section3 = '';  // Already shown locked above
  } else {
    const panicFrac = bp.panic_fraction || 0;
    const panicCount = bp.panic_detected_count || 0;
    const sgPenalty = bp.second_guess_penalty_avg_marks || 0;
    const avoidChapters = bp.avoidance_chapters || [];
    const overconfRate = bp.overconfidence_rate || 0;
    const underconfRate = bp.underconfidence_rate || 0;
    const fatigue = bp.fatigue_threshold_mins;
    const qSelectScore = bp.question_selection_score || 0;

    const flagItems = [];
    if (panicFrac > 0.1) flagItems.push({icon:'⚡', name:'Panic Behavior', evidence:`Detected in ${panicCount} of ${n} tests — panic fraction: ${(panicFrac*100).toFixed(0)}%`, sev: panicFrac > 0.4 ? 'high' : 'medium', freq:`${panicCount}/${n} tests`});
    if (sgPenalty > 0.5) flagItems.push({icon:'🔄', name:'Second-Guessing', evidence:`Avg ${sgPenalty.toFixed(1)} marks/test lost by changing correct answers near end`, sev: sgPenalty > 2 ? 'high' : 'medium', freq:`Every test`});
    if (avoidChapters.length > 0) flagItems.push({icon:'🚫', name:'Chapter Avoidance', evidence:`Chapters avoided in >30% of tests: ${avoidChapters.slice(0,3).join(', ')}`, sev:'medium', freq:`${avoidChapters.length} chapters`});
    if (overconfRate > 0.2) flagItems.push({icon:'📈', name:'Overconfidence', evidence:`${(overconfRate*100).toFixed(0)}% of times you felt "Sure" — you were wrong`, sev: overconfRate > 0.4 ? 'high' : 'medium', freq:`${(overconfRate*100).toFixed(0)}% of attempts`});
    if (underconfRate > 0.3) flagItems.push({icon:'📉', name:'Underconfidence', evidence:`${(underconfRate*100).toFixed(0)}% of times you felt "Unsure" — you were actually right`, sev:'medium', freq:`${(underconfRate*100).toFixed(0)}% of attempts`});
    if (fatigue) flagItems.push({icon:'😴', name:'Fatigue Pattern', evidence:`Performance drops consistently after minute ${fatigue}`, sev:'medium', freq:'Most tests'});
    if (qSelectScore < 0.4) flagItems.push({icon:'🎲', name:'Poor Question Selection', evidence:`Question selection score: ${(qSelectScore*100).toFixed(0)}/100 — skipping high-value Qs, attempting low-value Qs`, sev:'medium', freq:'Pattern detected'});

    section3 = `
      <div class="card mb-2">
        <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.06em">🧠 Behavioral Flags (${n} tests analyzed)</div>
        ${flagItems.length > 0 ? flagItems.map(f => {
          const sevColor = f.sev==='high' ? 'var(--red)' : f.sev==='medium' ? 'var(--amber)' : 'var(--green)';
          return `<div class="flex items-start gap-2 mb-2" style="padding:.75rem;background:var(--surface2);border-radius:10px;border-left:4px solid ${sevColor}">
            <div style="font-size:1.1rem;flex-shrink:0">${f.icon}</div>
            <div style="flex:1">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-sm font-bold">${esc(f.name)}</span>
                <span class="tag" style="font-size:.65rem;background:${sevColor}22;color:${sevColor};margin-left:auto">${f.sev}</span>
              </div>
              <div class="text-xs text-muted">${esc(f.evidence)}</div>
              <div class="text-xs" style="color:var(--text2);margin-top:.2rem">Detected: ${esc(f.freq)}</div>
            </div>
          </div>`;
        }).join('') : `<div style="padding:1.5rem;text-align:center;color:var(--text2);font-size:.875rem">✅ No significant behavioral flags detected yet</div>`}
      </div>`;
  }

  // ── SECTION 4: Digital Twin Scores (level 3+) ─────────────────────────────
  let section4 = '';
  if (level < 3) {
    section4 = `<div class="mb-2">${buildLockCard(3, n, 'Digital Twin Cognitive Scores')}</div>`;
  } else {
    const cogKeys = Object.keys(COGNITIVE_LABELS);
    const scoreHistory2 = twin.score_history || [];
    const prevScores = scoreHistory2.length >= 2 ? (scoreHistory2[scoreHistory2.length-2]?.scores || {}) : {};
    section4 = `
      <div class="card mb-2">
        <div class="text-xs font-bold text-muted mb-3" style="text-transform:uppercase;letter-spacing:.06em">🧬 Digital Twin — Cognitive Profile</div>
        <div style="display:flex;flex-direction:column;gap:.75rem;margin-bottom:1.5rem">
          ${cogKeys.map(k => {
            const val = scores[k];
            if (val === null || val === undefined) return '';
            const prev = prevScores[k];
            const trend = prev !== null && prev !== undefined ? (val > prev + 1 ? '↑' : val < prev - 1 ? '↓' : '→') : '—';
            const trendColor = trend === '↑' ? 'var(--green)' : trend === '↓' ? 'var(--red)' : 'var(--text2)';
            const barColor = val >= 70 ? 'var(--green)' : val >= 50 ? 'var(--amber)' : 'var(--red)';
            return `<div class="flex items-center gap-2">
              <div style="width:155px;font-size:.78rem;color:var(--text2);flex-shrink:0">${esc(COGNITIVE_LABELS[k])}</div>
              <div style="flex:1;background:var(--border);border-radius:4px;height:8px">
                <div style="height:8px;border-radius:4px;background:${barColor};width:${val}%;transition:width .6s"></div>
              </div>
              <div style="width:38px;text-align:right;font-size:.8rem;font-weight:700;color:${barColor}">${val}</div>
              <div style="width:18px;text-align:center;font-size:.9rem;color:${trendColor}">${trend}</div>
            </div>`;
          }).filter(Boolean).join('')}
        </div>
        <div style="height:200px"><canvas id="riRadarChart"></canvas></div>
      </div>`;
  }

  // ── SECTION 5: Rank Prediction (level 4+) ─────────────────────────────────
  let section5 = '';
  if (level < 4) {
    section5 = `<div class="mb-2">${buildLockCard(4, n, 'Rank & Score Prediction')}</div>`;
  } else {
    const confPct = preds.confidence_pct || 0;
    const rankLow = preds.rank_range_low;
    const rankHigh = preds.rank_range_high;
    const scoreLow = preds.score_range_low;
    const scoreHigh = preds.score_range_high;
    const onTrack = preds.on_track;
    const targetRank = twin.target_rank;
    const gap = rankLow && targetRank && rankLow > targetRank ? rankLow - targetRank : null;

    section5 = `
      <div class="card mb-2">
        <div class="text-xs font-bold text-muted mb-3" style="text-transform:uppercase;letter-spacing:.06em">🔮 Rank & Score Prediction</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
          <div style="background:var(--surface2);border-radius:10px;padding:1rem">
            <div class="text-xs text-muted mb-1">Predicted Rank</div>
            <div style="font-size:1.5rem;font-weight:700;font-family:'Syne',sans-serif;color:var(--brand2)">${rankLow ? `${rankLow.toLocaleString()} – ${rankHigh?.toLocaleString()}` : 'Insufficient data'}</div>
          </div>
          <div style="background:var(--surface2);border-radius:10px;padding:1rem">
            <div class="text-xs text-muted mb-1">Predicted Score</div>
            <div style="font-size:1.5rem;font-weight:700;font-family:'Syne',sans-serif;color:var(--text1)">${scoreLow !== null ? `${scoreLow} – ${scoreHigh}` : '—'}</div>
          </div>
        </div>
        <div class="flex items-center gap-2 mb-3">
          <div style="flex:1;background:var(--border);border-radius:4px;height:8px">
            <div style="height:8px;border-radius:4px;background:var(--brand2);width:${confPct}%"></div>
          </div>
          <span class="text-xs text-muted">${confPct}% confidence (${n} tests)</span>
        </div>
        ${onTrack !== null ? `
          <div style="padding:.85rem 1rem;border-radius:8px;background:${onTrack ? '#22d3a020' : '#f8717120'};border:1px solid ${onTrack ? 'var(--green)' : 'var(--red)'}">
            <span style="font-size:1rem">${onTrack ? '✅' : '❌'}</span>
            <span class="text-sm font-bold" style="color:${onTrack?'var(--green)':'var(--red)'};margin-left:.5rem">
              ${onTrack ? `On track for target rank ${targetRank?.toLocaleString() || ''}` : `Behind target — need +${gap ? gap.toLocaleString() : '?'} rank improvement to reach rank ${targetRank?.toLocaleString() || 'target'}`}
            </span>
          </div>
        ` : ''}
        ${scoreHistory.length > 1 ? `<div style="height:160px;margin-top:1rem"><canvas id="riTrendChart"></canvas></div>` : ''}
      </div>`;
  }

  return `
    ${section1}
    ${section2}
    ${section3}
    ${section4}
    ${section5}
  `;
}

// ── RANK INTEL CHART INITIALIZATION ───────────────────────────────────────────
function initRankIntelCharts() {
  const ri = state.data.rankIntel || {};
  const twin = ri.twin || state.twin || {};
  const scoreHistory = ri.score_history || [];
  const scores = twin.scores || {};
  const COGNITIVE_LABELS = {conceptual_understanding:'Conceptual',problem_solving:'Problem Solving',time_management:'Time Mgmt',confidence_calibration:'Confidence',retention:'Retention',exam_readiness:'Exam Ready',adaptability:'Adaptability'};

  // Sparkline chart in section 1
  const sparkEl = document.getElementById('riSparkChart');
  if (sparkEl && scoreHistory.length > 1) {
    if (window._riSparkChart) window._riSparkChart.destroy();
    window._riSparkChart = new Chart(sparkEl, {
      type: 'line',
      data: {
        labels: scoreHistory.map(s => (s.submitted_at||'').slice(5,10) || ''),
        datasets: [{
          label: 'Score %', data: scoreHistory.map(s => s.pct),
          fill: true, backgroundColor: '#7c6af518', borderColor: '#7c6af5',
          tension: .4, pointBackgroundColor: '#7c6af5', pointRadius: 4,
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100 }, x: { display: false } } }
    });
  }

  // Radar chart in section 4
  const radarEl = document.getElementById('riRadarChart');
  if (radarEl) {
    const cogKeys = Object.keys(COGNITIVE_LABELS);
    const vals = cogKeys.map(k => scores[k] || 0);
    if (vals.some(v => v > 0)) {
      if (window._riRadarChart) window._riRadarChart.destroy();
      window._riRadarChart = new Chart(radarEl, {
        type: 'radar',
        data: {
          labels: cogKeys.map(k => COGNITIVE_LABELS[k]),
          datasets: [{ label: 'Cognitive Profile', data: vals, backgroundColor: '#7c6af530', borderColor: '#7c6af5', pointBackgroundColor: '#7c6af5', pointRadius: 4 }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 100, ticks: { display: false }, grid: { color: '#ffffff10' }, pointLabels: { color: '#8888aa', font: { size: 11 } } } }, plugins: { legend: { display: false } } }
      });
    }
  }

  // Trend chart in section 5
  const trendEl = document.getElementById('riTrendChart');
  if (trendEl && scoreHistory.length > 1) {
    if (window._riTrendChart) window._riTrendChart.destroy();
    const labels = scoreHistory.map(s => (s.submitted_at||'').slice(5,10) || '');
    const dataPoints = scoreHistory.map(s => s.pct);
    // Simple linear projection for next point
    if (dataPoints.length >= 2) {
      const last = dataPoints[dataPoints.length-1];
      const diff = (last - dataPoints[0]) / (dataPoints.length-1);
      labels.push('Proj.');
      dataPoints.push(null); // break actual line
    }
    window._riTrendChart = new Chart(trendEl, {
      type: 'line',
      data: {
        labels,
        datasets: [{ label: 'Score %', data: dataPoints.slice(0,-1), fill: true, backgroundColor: '#22d3a015', borderColor: '#22d3a0', tension: .4, pointBackgroundColor: '#22d3a0', pointRadius: 5 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100 } } }
    });
  }
}

// ── TEST LIBRARY ─────────────────────────────────────────────────────────────
const LIBRARY_FILTERS = [
  {id:'all', label:'All'},
  {id:'full_mock', label:'Full Mocks'},
  {id:'subject_mock', label:'Subject Mocks'},
  {id:'subject_test', label:'Subject Tests'},
  {id:'unit_mock', label:'Unit Mocks'},
  {id:'chapter_test', label:'Quick Practice'},
];

function buildTestLibrary() {
  const templates = state.data.templates || [];
  const filter = state.libraryFilter || 'all';
  const filtered = filter === 'all' ? templates : templates.filter(t => t.test_type === filter);

  return `
  <div class="flex items-center gap-1 mb-2" style="flex-wrap:wrap">
    ${LIBRARY_FILTERS.map(f => `
      <button class="btn ${filter===f.id?'btn-primary':'btn-ghost'} btn-sm" onclick="setLibraryFilter('${f.id}')">${esc(f.label)}</button>
    `).join('')}
  </div>
  ${filtered.length ? `
    <div class="grid-2">
      ${filtered.map(t => buildTemplateCard(t)).join('')}
    </div>
  ` : `<div class="empty-state"><div class="em">📚</div><p>No tests available yet. Check back soon.</p></div>`}
  `;
}

function buildTemplateCard(t) {
  const dist = t._difficulty || {easy:0, medium:0, hard:0, total:0};
  const typeLabels = {full_mock:'Full Mock', subject_mock:'Subject Mock', subject_test:'Subject Test', unit_mock:'Unit Mock', chapter_test:'Quick Practice', custom:'Custom'};
  const dateAdded = t.created_at ? esc(t.created_at.split(' ')[0]) : '';
  return `
    <div class="card-sm" style="display:flex;flex-direction:column;gap:.6rem">
      <div class="flex items-center gap-1">
        <span class="tag badge-brand">${esc(typeLabels[t.test_type] || t.test_type)}</span>
        <span class="text-xs text-muted" style="margin-left:auto">${dateAdded}</span>
      </div>
      <div class="font-bold" style="font-family:'Syne',sans-serif">${esc(t.name)}</div>
      <div class="flex items-center gap-2 text-xs text-muted">
        <span>📝 ${t.question_count || 0} questions</span>
        <span>⏱️ ${t.duration_mins} mins</span>
        <span>🏆 ${t.total_marks} marks</span>
      </div>
      ${dist.total > 0 ? `
        <div>
          <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface3)">
            ${dist.easy>0?`<div style="width:${dist.easy/dist.total*100}%;background:var(--green)" title="Easy: ${dist.easy}"></div>`:''}
            ${dist.medium>0?`<div style="width:${dist.medium/dist.total*100}%;background:var(--amber)" title="Medium: ${dist.medium}"></div>`:''}
            ${dist.hard>0?`<div style="width:${dist.hard/dist.total*100}%;background:var(--red)" title="Hard: ${dist.hard}"></div>`:''}
          </div>
          <div class="flex items-center gap-1 text-xs text-muted" style="margin-top:.35rem">
            <span>🟢 ${dist.easy} easy</span><span>🟡 ${dist.medium} medium</span><span>🔴 ${dist.hard} hard</span>
          </div>
        </div>
      ` : ''}
      <button class="btn btn-primary" onclick="startTemplate(${t.id})" style="margin-top:.25rem">Start Test →</button>
    </div>
  `;
}

window.setLibraryFilter = function(filterId) {
  state.libraryFilter = filterId;
  render();
};

window.startTemplate = async function(templateId) {
  const detail = await api(`/api/templates/${templateId}`);
  if (!detail) return;
  state.preTestModal = {template: detail, energyLevel: null};
  render();
};

window.selectPreTestEnergy = function(level) {
  if (!state.preTestModal) return;
  state.preTestModal.energyLevel = level;
  render();
};

window.cancelPreTestModal = function() {
  state.preTestModal = null;
  render();
};

window.confirmStartTest = async function() {
  const modal = state.preTestModal;
  if (!modal || !modal.energyLevel) return;
  const r = await post('/api/sessions', {
    student_id: state.student.id,
    template_id: modal.template.id,
    energy_level: modal.energyLevel,
  });
  if (!r || !r.session_id) return;

  state.preTestModal = null;
  state.testSession = {
    sessionId: r.session_id,
    template: r.template,
    questions: r.questions,
    sections: [...new Set(r.questions.map(q => q.section_name))],
    currentSection: r.questions[0]?.section_name,
    currentIndex: 0,
    answers: {},
    flagged: {},
    confidence: {},
    timeRemainingSecs: r.template.duration_mins * 60,
    timerInterval: null,
    submitting: false,
    showSubmitModal: false,
    finalFeeling: null,
    energyLevelAtStart: modal.energyLevel,
  };
  EventManager.init(r.session_id);
  startTestTimer();
  markVisited(state.testSession.questions[0].id);
  EventManager.onQuestionView(state.testSession.questions[0].id);
  render();
};

// ── PRE-TEST MODAL ────────────────────────────────────────────────────────────
const ENERGY_EMOJI = ['😴','😕','😐','🙂','💪'];

      <p class="text-sm mt-2" style="font-weight:600">How are you feeling right now?</p>

        ${ENERGY_EMOJI.map((e,i) => `
          <div class="energy-opt ${m.energyLevel===i+1?'selected':''}" onclick="selectPreTestEnergy(${i+1})">${e}<div class="text-xs mt-1">${i+1}</div></div>

// ── TIMER ─────────────────────────────────────────────────────────────────────
function startTestTimer() {
  const ts = state.testSession;
  if (!ts) return;
  if (ts.timerInterval) clearInterval(ts.timerInterval);
  ts.timerInterval = setInterval(() => {
    if (!state.testSession) return;
    state.testSession.timeRemainingSecs--;
    if (state.testSession.timeRemainingSecs <= 0) {
      state.testSession.timeRemainingSecs = 0;
      clearInterval(state.testSession.timerInterval);
      autoSubmitTimedOut();
      return;
    }
    // Only repaint the timer node directly to avoid a full re-render every second.
    const el = document.getElementById('test-timer-display');
    if (el) {
      el.textContent = formatTimer(state.testSession.timeRemainingSecs);
      el.className = 'test-timer ' + timerUrgencyClass(state.testSession.timeRemainingSecs);
    } else {
      render();
    }
  }, 1000);
}
function formatTimer(secs) {
  const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${m}:${String(s).padStart(2,'0')}`;
}
function timerUrgencyClass(secs) {
  if (secs <= 600) return 'red';
  if (secs <= 1800) return 'amber';
  return '';
}

async function autoSubmitTimedOut() {
  await doSubmitTest('timed_out');
}

function buildTestInterface() {

        `).join('')}
      </div>
      <button class="btn btn-ghost btn-sm" style="display:none" id="navgrid-toggle" onclick="toggleNavGrid()">☰ Questions</button>
      <div id="test-timer-display" class="test-timer ${timerUrgencyClass(ts.timeRemainingSecs)}">${formatTimer(ts.timeRemainingSecs)}</div>

    </div>
    <div class="test-body">

            const idx = ts.questions.indexOf(qq);
            const st = getQuestionNavState(qq.id);
            const flaggedCls = ts.flagged[qq.id] ? 'flagged' : '';
            const curCls = idx === ts.currentIndex ? 'current' : '';
            return `<button class="qnav-btn ${st} ${flaggedCls} ${curCls}" onclick="jumpToQuestion(${idx})">${qq.question_order}</button>`;
          }).join('')}
        </div>

          <div class="qnav-legend-item"><span class="qnav-legend-swatch" style="background:var(--green);border-color:var(--green)"></span>Answered</div>
          <div class="qnav-legend-item"><span class="qnav-legend-swatch" style="background:var(--surface2)"></span>Not visited</div>
          <div class="qnav-legend-item"><span class="qnav-legend-swatch" style="background:#fbbf2440;border-color:var(--amber)"></span>Visited, unanswered</div>
          <div class="qnav-legend-item"><span class="qnav-legend-swatch" style="position:relative">⚑</span>Flagged</div>
        </div>
        <div class="text-xs text-muted mt-2">Attempted: ${attempted} / ${ts.questions.length} · Flagged: ${flaggedCount}</div>
      </div>

        ${q ? buildTestQuestion(q, qState) : '<div class="empty-state">No question.</div>'}
      </div>
    </div>
    <div class="test-footer-nav">
      <button class="btn btn-ghost" onclick="navTestQuestion(-1)" ${ts.currentIndex===0?'disabled style="opacity:.4"':''}>← Prev</button>
      <button class="btn btn-ghost" onclick="clearTestAnswer(${q?.id})">Clear</button>
      <button class="btn btn-ghost" onclick="toggleTestFlag(${q?.id})">${ts.flagged[q?.id]?'⚑ Unflag':'⚑ Flag'}</button>
      <button class="btn btn-ghost" onclick="skipTestQuestion()">Skip →</button>
      <button class="btn btn-primary" style="margin-left:auto" onclick="navTestQuestion(1)" ${ts.currentIndex===ts.questions.length-1?'disabled style="opacity:.4"':''}>Next →</button>
    </div>
  </div>
  ${ts.showSubmitModal ? buildSubmitModal() : ''}`;
}

function getQuestionNavState(qId) {
  const ts = state.testSession;
  if (ts.answers[qId] !== undefined && ts.answers[qId] !== '' &&
      !(Array.isArray(ts.answers[qId]) && ts.answers[qId].length===0)) return 'answered';
  if (ts._visited && ts._visited[qId]) return 'visited';
  return 'not_visited';
}

function buildTestQuestion(q, qState) {
  const ts = state.testSession;
  const selected = ts.answers[q.id];
  const marksLabel = `+${q.marks_correct} / ${q.marks_incorrect}`;

  let answerUI = '';
  if (q.question_type === 'single_correct' || q.question_type === 'passage_based') {
    const opts = [['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].filter(([,t]) => t);
    answerUI = opts.map(([letter, text]) => `
      <div class="test-option ${selected===letter?'selected':''}" onclick="selectTestAnswer(${q.id}, '${letter}')">
        <div class="test-option-radio"></div>
        <div>(${letter}) ${esc(text)}</div>
      </div>
    `).join('');
  } else if (q.question_type === 'multi_correct') {
    const opts = [['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].filter(([,t]) => t);
    const selArr = Array.isArray(selected) ? selected : [];
    answerUI = opts.map(([letter, text]) => `
      <div class="test-option ${selArr.includes(letter)?'selected':''}" onclick="toggleTestMultiAnswer(${q.id}, '${letter}')">
        <div class="test-option-checkbox"></div>
        <div>(${letter}) ${esc(text)}</div>
      </div>
    `).join('');
  } else if (q.question_type === 'integer') {
    answerUI = `<input type="number" class="test-integer-input" placeholder="Enter integer answer"
      value="${selected !== undefined ? esc(selected) : ''}"
      onchange="selectTestAnswer(${q.id}, this.value)" />`;
  }

  const confidenceUI = (selected !== undefined && selected !== '' && !(Array.isArray(selected) && selected.length===0)) ? `
    <div class="confidence-row">
      <button class="confidence-btn ${ts.confidence[q.id]==='sure'?'selected-sure':''}" onclick="rateTestConfidence(${q.id},'sure')">🟢 Sure</button>
      <button class="confidence-btn ${ts.confidence[q.id]==='unsure'?'selected-unsure':''}" onclick="rateTestConfidence(${q.id},'unsure')">🟡 Unsure</button>
      <button class="confidence-btn ${ts.confidence[q.id]==='guessing'?'selected-guessing':''}" onclick="rateTestConfidence(${q.id},'guessing')">🔴 Guessing</button>
    </div>` : '';

  return `
    <div class="test-q-meta">
      <span class="tag badge-brand">Q ${q.question_order} of ${ts.questions.length}</span>
      <span class="tag" style="background:var(--surface2)">Marks: ${marksLabel}</span>
      <span class="tag" style="background:var(--surface2)">${esc(q.difficulty)}</span>
    </div>
    <div class="test-q-text">${esc(q.question_text)}</div>
    ${answerUI}
    ${confidenceUI}
  `;
}

window.switchTestSection = function(section) {
  const ts = state.testSession;
  if (ts.currentSection === section) return;
  EventManager.onSectionChange(ts.currentSection, section);
  ts.currentSection = section;
  const firstInSection = ts.questions.findIndex(q => q.section_name === section);
  ts.currentIndex = firstInSection >= 0 ? firstInSection : 0;
  markVisited(ts.questions[ts.currentIndex].id);
  EventManager.onQuestionView(ts.questions[ts.currentIndex].id);
  render();
};

window.jumpToQuestion = function(index) {
  const ts = state.testSession;
  ts.currentIndex = index;
  ts.currentSection = ts.questions[index].section_name;
  markVisited(ts.questions[index].id);
  EventManager.onQuestionView(ts.questions[index].id);
  render();
};

window.navTestQuestion = function(delta) {
  const ts = state.testSession;
  const next = ts.currentIndex + delta;
  if (next < 0 || next >= ts.questions.length) return;
  ts.currentIndex = next;
  ts.currentSection = ts.questions[next].section_name;
  markVisited(ts.questions[next].id);
  EventManager.onQuestionView(ts.questions[next].id);
  render();
};

function markVisited(qId) {
  const ts = state.testSession;
  if (!ts._visited) ts._visited = {};
  ts._visited[qId] = true;
}

window.selectTestAnswer = function(qId, value) {
  const ts = state.testSession;
  ts.answers[qId] = value;
  EventManager.onAnswerSelect(qId, value);
  render();
};

window.toggleTestMultiAnswer = function(qId, letter) {
  const ts = state.testSession;
  const current = Array.isArray(ts.answers[qId]) ? [...ts.answers[qId]] : [];
  const idx = current.indexOf(letter);
  if (idx >= 0) current.splice(idx, 1); else current.push(letter);
  ts.answers[qId] = current;
  EventManager.onAnswerSelect(qId, current.slice().sort().join(''));
  render();
};

window.clearTestAnswer = function(qId) {
  if (qId === undefined || qId === null) return;
  const ts = state.testSession;
  if (ts.answers[qId] === undefined) return;
  EventManager.onAnswerClear(qId);
  delete ts.answers[qId];
  delete ts.confidence[qId];
  render();
};

window.toggleTestFlag = function(qId) {
  if (qId === undefined || qId === null) return;
  const ts = state.testSession;
  ts.flagged[qId] = !ts.flagged[qId];
  EventManager.onFlag(qId, ts.flagged[qId]);
  render();
};

window.skipTestQuestion = function() {
  const ts = state.testSession;
  const q = ts.questions[ts.currentIndex];
  if (q) EventManager.onSkip(q.id);
  navTestQuestion(1);
};

window.rateTestConfidence = function(qId, rating) {
  const ts = state.testSession;
  ts.confidence[qId] = rating;
  EventManager.onConfidenceRate(qId, rating);
  render();
};

window.toggleNavGrid = function() {

window.confirmSubmitTest = async function() {
  const ts = state.testSession;
  if (!ts.finalFeeling || ts.submitting) return;
  await doSubmitTest(ts.finalFeeling);
};

async function doSubmitTest(feelingOverride) {
  const ts = state.testSession;
  if (!ts || ts.submitting) return;
  ts.submitting = true;
  render();

  if (ts.timerInterval) clearInterval(ts.timerInterval);

  // Normalize answers to {question_id(string): answer} for the API,
  // joining multi-select arrays into a sorted letter string.
  const finalAnswers = {};
  for (const [qId, val] of Object.entries(ts.answers)) {
    finalAnswers[qId] = Array.isArray(val) ? val.slice().sort().join('') : val;
  }

  await EventManager.onSubmit(finalAnswers);

  const result = await post(`/api/sessions/${ts.sessionId}/submit`, {
    answers: finalAnswers,
    final_30min_feeling: feelingOverride === 'timed_out' ? 'panicked' : feelingOverride,
    energy_level: ts.energyLevelAtStart || 3,
  });

  const sessionId = ts.sessionId;
  EventManager.destroy();
  state.testSession = null;
  state.preTestModal = null;

  if (!result) {
    state.page = 'tests';
    await loadPageData();
    render();
    return;
  }

  // The behavioral pipeline (mistake classification, rank leakage) runs as a
  // background task after submit returns, so it may not be done yet. Poll
  // briefly for analysis_ready before showing the result page, so "fix this
  // first" and per-question mistake labels are there on first paint rather
  // than appearing to be missing.
  let fullResult = await api(`/api/sessions/${sessionId}/result`);
  let attempts = 0;
  while (fullResult && !fullResult.analysis_ready && attempts < 10) {
    await new Promise(res => setTimeout(res, 300));
    fullResult = await api(`/api/sessions/${sessionId}/result`);
    attempts++;
  }

  state.lastTestResult = result;
  state.viewingResult = fullResult;
  state.resultFilter = 'all';
  state.resultOrigin = 'tests';
  state.page = 'result';
  // Phase 4: refresh the Digital Twin after every test so mentor and
  // dashboard reflect the latest behavioral profile immediately.
  await loadTwin();
  await loadRevisionCount();  // Phase 7: refresh revision badge
  await loadPageData();
  render();
}

const MISTAKE_TYPE_LABELS = {
  avoidance: 'Skipped — avoidable', guessing: 'Guessed', time_pressure: 'Rushed under pressure',
  careless: 'Careless slip', conceptual: "Concept gap", formula_recall: 'Formula recall',
  calculation: 'Calculation error', misread: 'Misread the question',
};

// Phase 7 — human-readable labels for "correct but ambiguous" warnings
const AMBIGUOUS_REASON_LABELS = {
  guessed_but_correct: { text: 'Right answer, but it looks guessed — fast with no real working', icon: '🎲' },
  too_long_for_right_answer: { text: 'Got it right, but took much longer than usual — concept still shaky', icon: '🐢' },

window.viewPastResult = async function(sessionId) {

  if (!result) return;
  state.viewingResult = result;
  state.resultOrigin = state.page === 'result' ? (state.resultOrigin || 'tests') : state.page;
  state.page = 'result';
  render();
  // Start polling if analysis not yet ready
  if (!result.analysis_ready) {
    startAnalysisPolling(sessionId);
  }
};

// Poll GET /api/sessions/{sid}/analysis every 3s until ready (max 60s)
function startAnalysisPolling(sessionId) {
  let attempts = 0;
  const maxAttempts = 20; // 60s
  const timer = setInterval(async () => {
    attempts++;
    if (attempts > maxAttempts) { clearInterval(timer); return; }
    try {
      const data = await api(`/api/sessions/${sessionId}/analysis`);
      if (data && data.analysis_ready) {
        clearInterval(timer);
        // Merge analysis data back into viewingResult
        if (state.viewingResult && state.viewingResult.session) {
          state.viewingResult.session.behavioral_flags_json = data.behavioral_flags || {};
          state.viewingResult.session.leakage_report_json = data.leakage_report || {};
          state.viewingResult.analysis_ready = true;
          // Reload full result to get updated question_results with mistake types
          const fresh = await api(`/api/sessions/${sessionId}/result`);
          if (fresh) state.viewingResult = fresh;
          // Also refresh twin since pipeline updated it
          await loadTwin();
        }
        // Phase 9: keep the Deep Review screen in sync too, if it's open on this session
        if (state.reviewSessionId === sessionId) {
          const freshReview = await api(`/api/sessions/${sessionId}/result`);
          if (freshReview) state.reviewData = freshReview;
        }
        if (state.page === 'result' || state.page === 'review') render();
      }
    } catch(e) { /* non-fatal */ }
  }, 3000);
}

async function fetchReviewMentor() {
  const sid = state.reviewSessionId;
  const r = state.reviewData;
  if (!sid || !r) return;
  const cache = state.reviewMentor[sid];
  if (cache && (cache.loading || cache.reply)) return; // already fired for this session

  state.reviewMentor[sid] = { loading: true, reply: null };
  render();

  const s = r.session;
  const templateName = r.template_name || s.template_name || 'this test';
  const prompt = `I just finished ${templateName} and scored ${s.raw_score}/${s.max_score}. ` +
    `Based on this test's data, give me: (1) the single most important behavioral pattern I must fix, ` +
    `(2) the single most important knowledge gap to address, and (3) exactly what I should do tomorrow.`;

  const resp = await post('/api/chat', { student_id: state.student.id, message: prompt });
  state.reviewMentor[sid] = {

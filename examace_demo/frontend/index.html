function buildTestResult() {
  const r = state.viewingResult;
  if (!r) return `<div class="empty-state"><div class="em">📄</div><p>No result loaded.</p><button class="btn btn-primary mt-2" onclick="navigate('tests')">Back to tests</button></div>`;

  const s = r.session;
  const pct = s.max_score ? Math.round((s.raw_score / s.max_score) * 100) : 0;
  const qrs = r.question_results || [];
  const correct = qrs.filter(q => q.is_correct).length;
  const wrong = qrs.filter(q => !q.is_correct && !q.is_skipped).length;
  const skipped = qrs.filter(q => q.is_skipped).length;
  const leakage = s.leakage_report_json || {};
  const flags = s.behavioral_flags_json || {};
  const analysisReady = r.analysis_ready;

  const filter = state.resultFilter || 'all';
  const ambiguousCount = qrs.filter(q => q.is_correct && q.is_ambiguous_correct).length;
  const filtered = qrs.filter(q => {
    if (filter === 'wrong') return !q.is_correct && !q.is_skipped;
    if (filter === 'skipped') return q.is_skipped;
    if (filter === 'correct') return q.is_correct;
    if (filter === 'ambiguous') return q.is_correct && q.is_ambiguous_correct;
    return true;
  });

  // Build analysis panel (shown when ready, or spinner if not)
  let analysisPanel = '';
  if (!analysisReady) {
    analysisPanel = `
      <div class="card mb-2" id="analysis-loading-card">
        <div class="flex items-center gap-2">
          <div class="spinner" style="width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--brand2);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0"></div>
          <div>
            <div class="text-sm font-bold">Analyzing your test…</div>
            <div class="text-xs text-muted">Behavioral patterns, mistake classification, rank leakage — this takes ~15 seconds</div>
          </div>
        </div>
      </div>`;
  } else {
    // Analysis is ready — show leakage summary + top 3 flags
    const leakageItems = Object.entries(leakage.breakdown || {}).map(([k,v]) => ({mistake_type:k, marks_lost:v.marks||0, count:v.count||0})).sort((a,b)=>b.marks_lost-a.marks_lost);
    const topLeakage = leakageItems.slice(0, 3);
    const panicData = flags.panic || {};
    const fatigueData = flags.fatigue || {};
    const skipData = flags.skip_pattern || {};

    // Build flag rows from behavioral data
    const detectedFlags = [];
    if (panicData.detected) detectedFlags.push({icon:'⚡', label:'Panic Detected', detail:`${panicData.correct_changed_to_wrong||0} correct answers changed to wrong in final ${(panicData.panic_window_start_mins||0).toFixed(0)} mins — lost ${(panicData.marks_lost_to_panic||0).toFixed(1)} marks`, sev:'high'});
    if (fatigueData.detected) detectedFlags.push({icon:'😴', label:'Fatigue Detected', detail:`Accuracy dropped after minute ${fatigueData.fatigue_threshold_mins||'?'}`, sev:'medium'});
    const avoidCount = (skipData.sight_skipped||[]).length;
    if (avoidCount > 0) detectedFlags.push({icon:'🚫', label:`${avoidCount} Questions Avoided`, detail:'Viewed < 10s and skipped — potential avoidance pattern', sev:'medium'});
    const totalLeaked = leakageItems.reduce((s,i) => s + (i.marks_lost||0), 0);

    analysisPanel = `
      <div class="card mb-2" style="border:1px solid var(--brand)">
        <div class="flex items-center gap-2 mb-2">
          <span style="font-size:1.1rem">🔬</span>
          <div class="section-title" style="margin:0">Behavioral Analysis</div>
          <span class="tag badge-green" style="margin-left:auto">Ready</span>
        </div>

        ${totalLeaked > 0 ? `
        <div style="background:var(--surface2);border-radius:10px;padding:1rem;margin-bottom:1rem">
          <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Rank Leakage — ${totalLeaked.toFixed(1)} marks lost this test</div>
          ${topLeakage.map(item => {
            const colors = {conceptual:'#f87171',calculation:'#fbbf24',time_pressure:'#a78bfa',guessing:'#94a3b8',careless:'#fb923c',avoidance:'#ef4444'};
            const col = colors[item.mistake_type] || '#94a3b8';
            const label = MISTAKE_TYPE_LABELS[item.mistake_type] || item.mistake_type;
            const barPct = totalLeaked > 0 ? Math.min(100, (item.marks_lost / totalLeaked) * 100) : 0;
            return `<div class="flex items-center gap-2 mb-2">
              <div style="width:100px;font-size:.78rem;color:var(--text2);flex-shrink:0">${esc(label)}</div>
              <div style="flex:1;background:var(--border);border-radius:4px;height:8px">
                <div style="height:8px;border-radius:4px;background:${col};width:${barPct.toFixed(0)}%"></div>
              </div>
              <div style="font-size:.78rem;font-weight:700;color:${col};width:40px;text-align:right">${item.marks_lost?.toFixed(1)||0}</div>
              <div class="text-xs text-muted" style="width:30px">${item.count}Q</div>
            </div>`;
          }).join('')}
          ${leakage.fix_this_first ? `
            <div style="margin-top:.75rem;padding:.75rem;background:var(--brand-glow);border:1px solid var(--brand);border-radius:8px">
              <div class="text-xs font-bold" style="color:var(--brand2);margin-bottom:.3rem">🎯 Fix This First</div>
              <div class="text-sm">${esc(leakage.fix_this_first)}</div>
              <button class="btn btn-sm" style="margin-top:.5rem;background:var(--brand);color:#fff" onclick="askMentorWith('How do I fix my ${esc(leakage.top_leakage_source||'top')} errors? I just scored ${s.raw_score}/${s.max_score}.')">Ask Mentor →</button>
            </div>
          ` : ''}
        </div>` : ''}

        ${detectedFlags.length > 0 ? `
        <div>
          <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Behavioral Flags</div>
          ${detectedFlags.map(f => {
            const sevColor = f.sev==='high'?'var(--red)':f.sev==='medium'?'var(--amber)':'var(--green)';
            return `<div class="flex items-start gap-2 mb-2" style="padding:.65rem .85rem;background:var(--surface2);border-radius:8px;border-left:3px solid ${sevColor}">
              <span>${f.icon}</span>
              <div style="flex:1">
                <div class="text-sm font-bold">${esc(f.label)}</div>
                <div class="text-xs text-muted">${esc(f.detail)}</div>
              </div>
            </div>`;
          }).join('')}
        </div>` : '<div class="text-sm text-muted">No significant behavioral flags detected this test.</div>'}
      </div>`;
  }

  return `
  <div class="card mb-2">
    <div style="display:flex;align-items:flex-start;gap:1.5rem;flex-wrap:wrap">
      <div>
        <div class="text-xs text-muted mb-1">${esc(s.submitted_at ? s.submitted_at.split(' ')[0] : '')} · ${esc(r.template_name || s.template_name || 'Test')}</div>
        <div style="font-size:2.5rem;font-weight:700;font-family:'Syne',sans-serif;color:${pct>70?'var(--green)':pct>50?'var(--amber)':'var(--red)'};line-height:1">${pct}%</div>
        <div class="text-sm text-muted mt-1">${s.raw_score} / ${s.max_score} marks</div>
      </div>
      <div style="display:flex;gap:1.5rem;margin-top:.25rem">
        <div style="text-align:center"><div class="font-bold" style="color:var(--green);font-size:1.3rem">${correct}</div><div class="text-xs text-muted">Correct</div></div>
        <div style="text-align:center"><div class="font-bold" style="color:var(--red);font-size:1.3rem">${wrong}</div><div class="text-xs text-muted">Wrong</div></div>
        <div style="text-align:center"><div class="font-bold" style="color:var(--amber);font-size:1.3rem">${skipped}</div><div class="text-xs text-muted">Skipped</div></div>
      </div>
    </div>
  </div>

  ${analysisPanel}

  <div class="flex items-center gap-1 mb-2" style="flex-wrap:wrap">
    ${[['all','All'],['wrong','Wrong'],['skipped','Skipped'],['correct','Correct']].map(([id,label]) => `
      <button class="btn ${filter===id?'btn-primary':'btn-ghost'} btn-sm" onclick="setResultFilter('${id}')">${label}</button>
    `).join('')}
    ${ambiguousCount > 0 ? `
      <button class="btn btn-sm" style="${filter==='ambiguous'?'background:var(--amber);color:#000':'background:#fbbf2418;color:var(--amber);border:1px solid #fbbf2444'}"
              onclick="setResultFilter('ambiguous')">⚠️ Needs Review (${ambiguousCount})</button>
    ` : ''}
    <div style="margin-left:auto;display:flex;gap:.5rem">
      ${analysisReady ? `<button class="btn btn-sm" style="background:var(--brand);color:#fff" onclick="openReview(${s.id})">🔬 Full Review</button>` : ''}
      ${analysisReady ? `<button class="btn btn-sm" style="background:var(--brand);color:#fff" onclick="navigate('rankintel')">View Full Analysis 🎯</button>` : ''}
      <button class="btn btn-ghost btn-sm" onclick="askMentorWith('I just finished a test and scored ${pct}% (${s.raw_score}/${s.max_score}). What should I do next?')">Ask Mentor 🤖</button>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:.75rem">
    ${filtered.length ? filtered.map(q => buildResultQuestionCard(q)).join('') : '<div class="empty-state"><div class="em">✓</div><p>No questions in this filter.</p></div>'}
  </div>
  <button class="btn btn-ghost mt-2" onclick="navigate('${state.resultOrigin === 'dashboard' ? 'dashboard' : 'tests'}')">← Back to ${state.resultOrigin === 'dashboard' ? 'dashboard' : 'test history'}</button>`;
}

function buildResultQuestionCard(q) {
  const statusColor = q.is_correct ? 'var(--green)' : q.is_skipped ? 'var(--amber)' : 'var(--red)';
  const statusLabel = q.is_correct ? 'Correct' : q.is_skipped ? 'Skipped' : 'Wrong';
  const opts = [['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].filter(([,t]) => t);
  const mistakeLabel = q.classified_mistake_type ? MISTAKE_TYPE_LABELS[q.classified_mistake_type] || q.classified_mistake_type : null;

  // Phase 7 — "correct but ambiguous" warning. Only shown when the answer
  // was right AND the system flagged it (guessed / too slow / flip-flopped).
  // Never shown on every correct answer — only the ones that deserve a
  // second look so the student doesn't mistake luck for mastery.
  const ambiguous = q.is_correct && q.is_ambiguous_correct && AMBIGUOUS_REASON_LABELS[q.ambiguous_reason];

  return `
  <div class="card-sm" ${ambiguous ? 'style="border-left:3px solid var(--amber)"' : ''}>
    <div class="flex items-center gap-1 mb-2">
      <span class="tag" style="background:${statusColor}22;color:${statusColor}">${statusLabel}</span>
      <span class="tag" style="background:var(--surface2)">${esc(q.chapter_name)}</span>
      ${mistakeLabel ? `<span class="tag" style="background:var(--surface2)">${esc(mistakeLabel)}</span>` : ''}
      ${ambiguous ? `<span class="tag" style="background:#fbbf2422;color:var(--amber);border:1px solid #fbbf2444">⚠️ Needs review</span>` : ''}
      <span class="text-xs text-muted" style="margin-left:auto">${q.marks_awarded>0?'+':''}${q.marks_awarded} marks</span>
    </div>
    ${ambiguous ? `
      <div style="display:flex;align-items:center;gap:.5rem;background:#fbbf2412;border:1px solid #fbbf2433;
                  border-radius:var(--r);padding:.5rem .65rem;margin-bottom:.65rem">
        <span style="font-size:1rem">${ambiguous.icon}</span>
        <span class="text-xs" style="color:var(--amber);font-weight:600">${esc(ambiguous.text)}</span>
      </div>
    ` : ''}
    <div class="text-sm mb-2">${esc(q.question_text)}</div>
    ${opts.length ? `
      <div style="display:flex;flex-direction:column;gap:.4rem;margin-bottom:.75rem">
        ${opts.map(([letter,text]) => {
          const isCorrectOpt = letter === (q.correct_answer||'').trim().toUpperCase();
          const isSelectedOpt = letter === (q.selected_answer||'').trim().toUpperCase();
          let style = 'border:1px solid var(--border2);background:var(--surface2)';
          if (isCorrectOpt) style = 'border:1px solid var(--green);background:#22d3a015;color:var(--green)';
          else if (isSelectedOpt && !isCorrectOpt) style = 'border:1px solid var(--red);background:#f8717115;color:var(--red)';
          return `<div style="padding:.5rem .75rem;border-radius:var(--r);font-size:.85rem;${style}">
            (${letter}) ${esc(text)} ${isCorrectOpt?' ✓':''}${isSelectedOpt && !isCorrectOpt?' ✗ (your answer)':''}
          </div>`;
        }).join('')}
      </div>
    ` : `
      <div class="text-xs text-muted mb-2">Your answer: <strong>${esc(q.selected_answer || '—')}</strong> · Correct: <strong style="color:var(--green)">${esc(q.correct_answer)}</strong></div>
    `}
    ${q.solution_text ? `
      <details>
        <summary class="text-xs" style="cursor:pointer;color:var(--brand2)">Show solution</summary>
        <div class="text-xs text-muted mt-1">${esc(q.solution_text)}</div>
      </details>
    ` : ''}
  </div>`;
}

window.setResultFilter = function(filter) {
  state.resultFilter = filter;
  render();
};

// ── PHASE 9: DEEP PERFORMANCE REVIEW (5-tab post-test review screen) ───────
function buildTestReview() {
  const r = state.reviewData;
  if (!r) return `<div class="empty-state"><div class="em">🔬</div><p>No review loaded.</p><button class="btn btn-primary mt-2" onclick="navigate('tests')">Back to tests</button></div>`;
  const s = r.session;
  const tabs = [
    [1, 'Overview'], [2, 'Question by Question'], [3, 'Behavioral Analysis'],
    [4, 'Rank Leakage Detail'], [5, 'AI Mentor'],
  ];
  const active = state.reviewTab;

  return `
  <div class="card mb-2">
    <div class="flex items-center gap-2" style="flex-wrap:wrap">
      <div>
        <div class="text-xs text-muted mb-1">${esc((s.submitted_at||'').split(' ')[0])} · ${esc(r.template_name || s.template_name || 'Test')}</div>
        <div style="font-size:1.4rem;font-weight:700;font-family:'Syne',sans-serif">Deep Performance Review</div>
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="navigate('${state.resultOrigin==='dashboard'?'dashboard':'tests'}')">← Back</button>
    </div>
  </div>
  <div class="flex items-center gap-1 mb-2" style="flex-wrap:wrap">
    ${tabs.map(([id,label]) => `<button class="btn ${active===id?'btn-primary':'btn-ghost'} btn-sm" onclick="setReviewTab(${id})">${id}. ${label}</button>`).join('')}
  </div>
  ${!r.analysis_ready ? `
    <div class="card mb-2">
      <div class="flex items-center gap-2">
        <div class="spinner"></div>
        <div>
          <div class="text-sm font-bold">Analyzing your test…</div>
          <div class="text-xs text-muted">This screen updates automatically once analysis finishes (~15s).</div>
        </div>
      </div>
    </div>` : ''}
  ${active===1 ? buildReviewTab1(r) : ''}
  ${active===2 ? buildReviewTab2(r) : ''}
  ${active===3 ? buildReviewTab3(r) : ''}
  ${active===4 ? buildReviewTab4(r) : ''}
  ${active===5 ? buildReviewTab5(r) : ''}
  `;
}

// TAB 1 — OVERVIEW
function buildReviewTab1(r) {
  const s = r.session;
  const flags = s.behavioral_flags_json || {};
  const leakage = s.leakage_report_json || {};
  const qrs = r.question_results || [];
  const correct = qrs.filter(q => q.is_correct).length;
  const wrong = qrs.filter(q => !q.is_correct && !q.is_skipped).length;
  const skipped = qrs.filter(q => q.is_skipped).length;
  const pct = s.max_score ? Math.round((s.raw_score / s.max_score) * 100) : 0;

  const panic = flags.panic || {};
  const fatigue = flags.fatigue || {};
  const skipPattern = flags.skip_pattern || {};
  const selection = flags.question_selection || {};

  const flagItems = [];
  if (panic.detected) flagItems.push({icon:'⚡', label:'Panic in the final stretch', detail:`${panic.correct_changed_to_wrong||0} correct answer(s) flipped to wrong after minute ${(panic.panic_window_start_mins||0).toFixed(0)} — cost ${(panic.marks_lost_to_panic||0).toFixed(1)} marks`, sev:'high'});
  if (fatigue.detected) flagItems.push({icon:'😴', label:`Fatigue after minute ${fatigue.fatigue_threshold_mins ?? '?'}`, detail:`Accuracy peaked at ${fatigue.peak_accuracy}% then dropped and never recovered`, sev:'medium'});
  const avoidCount = (skipPattern.sight_skipped||[]).length;
  if (avoidCount > 0) flagItems.push({icon:'🚫', label:`${avoidCount} question(s) avoided on sight`, detail:'Viewed for under 10 seconds then skipped without an attempt', sev:'medium'});
  if ((selection.selection_score ?? 1) < 0.6) flagItems.push({icon:'🎲', label:'Suboptimal question selection', detail: selection.advice || 'Selection strategy could be improved', sev:'medium'});
  const topFlags = flagItems.slice(0, 3);

  return `
  <div class="grid-2 mb-2">
    <div class="card">
      <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Score</div>
      <div style="font-size:2.5rem;font-weight:700;font-family:'Syne',sans-serif;color:${pct>70?'var(--green)':pct>50?'var(--amber)':'var(--red)'}">${pct}%</div>
      <div class="text-sm text-muted mb-2">${s.raw_score} / ${s.max_score} marks</div>
      <div style="display:flex;gap:1.5rem">
        <div style="text-align:center"><div class="font-bold" style="color:var(--green)">${correct}</div><div class="text-xs text-muted">Correct</div></div>
        <div style="text-align:center"><div class="font-bold" style="color:var(--red)">${wrong}</div><div class="text-xs text-muted">Wrong</div></div>
        <div style="text-align:center"><div class="font-bold" style="color:var(--amber)">${skipped}</div><div class="text-xs text-muted">Skipped</div></div>
      </div>
    </div>
    <div class="card">
      <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Actual vs Potential Score</div>
      <div style="display:flex;align-items:center;gap:1.5rem">
        <div style="text-align:center">
          <div class="text-xs text-muted mb-1">Actual</div>
          <div style="font-size:1.8rem;font-weight:700;font-family:'Syne',sans-serif">${leakage.actual_score ?? s.raw_score}</div>
        </div>
        <div style="color:var(--muted);font-size:1.2rem">→</div>
        <div style="text-align:center">
          <div class="text-xs text-muted mb-1">Potential</div>
          <div style="font-size:1.8rem;font-weight:700;font-family:'Syne',sans-serif;color:var(--brand2)">${leakage.potential_score ?? '—'}</div>
        </div>
      </div>
      ${leakage.fix_this_first ? `<div class="text-xs text-muted mt-2">${esc(leakage.fix_this_first)}</div>` : ''}
    </div>
  </div>
  <div class="card mb-2">
    <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Top Behavioral Flags</div>
    ${topFlags.length ? topFlags.map(f => {
      const sevColor = f.sev==='high' ? 'var(--red)' : 'var(--amber)';
      return `<div class="flex items-start gap-2 mb-2" style="padding:.65rem .85rem;background:var(--surface2);border-radius:8px;border-left:3px solid ${sevColor}">
        <span>${f.icon}</span>
        <div style="flex:1"><div class="text-sm font-bold">${esc(f.label)}</div><div class="text-xs text-muted">${esc(f.detail)}</div></div>
      </div>`;
    }).join('') : '<div class="text-sm text-muted">No significant behavioral flags this test.</div>'}
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Fatigue Curve</div>
      ${(flags.fatigue?.curve||[]).length ? `<div class="chart-wrap"><canvas id="reviewFatigueChart"></canvas></div>` : '<div class="text-sm text-muted">Not enough data for this test.</div>'}
    </div>
    <div class="card">
      <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Section Allocation — Actual vs Optimal</div>
      ${Object.keys(flags.section_allocation||{}).length ? `<div class="chart-wrap"><canvas id="reviewSectionChart"></canvas></div>` : '<div class="text-sm text-muted">Not enough data for this test.</div>'}
    </div>
  </div>`;
}

// TAB 2 — QUESTION BY QUESTION
function buildReviewTab2(r) {
  const qrs = r.question_results || [];
  const filter = state.reviewQFilter;
  const filtered = qrs.filter(q => {
    if (filter === 'incorrect') return !q.is_correct && !q.is_skipped;
    if (filter === 'skipped') return q.is_skipped;
    if (filter === 'changed') return (q.answer_change_count||0) > 0;
    return true;
  });
  const speedLabel = (ratio) => {
    if (ratio === null || ratio === undefined) return '—';
    if (ratio < 0.7) return 'Fast';
    if (ratio > 1.3) return 'Slow';
    return 'Normal';
  };
  const speedColor = (label) => label==='Fast' ? 'var(--blue)' : label==='Slow' ? 'var(--red)' : label==='Normal' ? 'var(--green)' : 'var(--muted)';

  return `
  <div class="card">
    <div class="flex items-center gap-1 mb-2" style="flex-wrap:wrap">
      ${[['all','All'],['incorrect','Incorrect'],['skipped','Skipped'],['changed','Changed Answers']].map(([id,label]) => `
        <button class="btn ${filter===id?'btn-primary':'btn-ghost'} btn-sm" onclick="setReviewQFilter('${id}')">${label}</button>
      `).join('')}
    </div>
    <div style="overflow-x:auto">
      <table class="table">
        <thead><tr>
          <th>Q#</th><th>Chapter</th><th>Difficulty</th><th>Your Answer</th><th>Correct</th>
          <th>Time</th><th>Speed</th><th>Mistake Type</th><th>Confidence</th><th>Changes</th>
        </tr></thead>
        <tbody>
          ${filtered.map((q, i) => {
            const speed = speedLabel(q.time_ratio);
            const mistakeLabel = q.classified_mistake_type ? (MISTAKE_TYPE_LABELS[q.classified_mistake_type]||q.classified_mistake_type) : '—';
            const confText = (q.mistake_confidence && q.mistake_confidence > 0)
              ? (q.mistake_confidence > 0.6 ? `${Math.round(q.mistake_confidence*100)}%` : `possibly (${Math.round(q.mistake_confidence*100)}%)`)
              : '—';
            const changedInPanic = (q.answer_change_count||0) > 0 && q.in_panic_window;
            const expanded = state.reviewExpanded[q.question_id];
            const timeSecs = q.time_spent_ms ? Math.round(q.time_spent_ms/1000) : 0;
            const opts = [['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].filter(([,t]) => t);
            return `
            <tr style="cursor:pointer;${changedInPanic ? 'background:#fbbf2415' : ''}" onclick="toggleReviewRow(${q.question_id})">
              <td>${i+1}</td>
              <td>${esc(q.chapter_name||'')}</td>
              <td style="text-transform:capitalize">${esc(q.difficulty||'')}</td>
              <td>${esc(q.selected_answer||'—')}</td>
              <td style="color:var(--green)">${esc(q.correct_answer||'')}</td>
              <td>${timeSecs}s</td>
              <td><span class="tag" style="background:${speedColor(speed)}22;color:${speedColor(speed)}">${speed}</span></td>
              <td>${esc(mistakeLabel)}</td>
              <td>${confText}</td>
              <td>${q.answer_change_count||0}${changedInPanic ? ' ⚠️' : ''}</td>
            </tr>
            ${expanded ? `
            <tr><td colspan="10" style="background:var(--surface2)">
              <div class="text-sm mb-2">${esc(q.question_text)}</div>
              ${opts.length ? opts.map(([letter,text]) => `<div class="text-xs text-muted">(${letter}) ${esc(text)}</div>`).join('') : ''}
              ${q.solution_text ? `<div class="text-xs mt-2" style="color:var(--brand2)">Solution: ${esc(q.solution_text)}</div>` : ''}
            </td></tr>` : ''}
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
    ${!filtered.length ? '<div class="empty-state"><div class="em">✓</div><p>No questions in this filter.</p></div>' : ''}
  </div>`;
}

// TAB 3 — BEHAVIORAL ANALYSIS
function buildReviewTab3(r) {
  const s = r.session;
  const flags = s.behavioral_flags_json || {};
  const panic = flags.panic || {};
  const fatigue = flags.fatigue || {};
  const skip = flags.skip_pattern || {};
  const alloc = flags.section_allocation || {};
  const selection = flags.question_selection || {};
  const qrs = r.question_results || [];
  const qNo = (qid) => { const idx = qrs.findIndex(q => q.question_id === qid); return idx >= 0 ? idx+1 : '?'; };

  const skipGroups = [
    {label:'Sight-skipped (viewed <10s, never attempted)', ids: skip.sight_skipped||[], color:'var(--red)'},
    {label:'Abandoned after attempt (viewed >30s, never answered)', ids: skip.attempt_abandoned||[], color:'var(--amber)'},
    {label:'Uncertain — revisited or changed answer before locking in', ids: [...(skip.uncertain_correct||[]), ...(skip.uncertain_wrong||[])], color:'var(--blue)'},
  ];

  return `
  <div class="grid-2 mb-2">
    <div class="card">
      <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Fatigue</div>
      ${(fatigue.curve||[]).length ? `<div class="chart-wrap"><canvas id="reviewFatigueChart2"></canvas></div>` : '<div class="text-sm text-muted">Not enough data.</div>'}
      <div class="text-xs text-muted mt-2">${fatigue.detected ? `Accuracy peaked at ${fatigue.peak_accuracy}%, then dropped and stayed down after minute <strong style="color:var(--amber)">${fatigue.fatigue_threshold_mins}</strong>.` : 'No sustained fatigue drop detected this test.'}</div>
    </div>
    <div class="card">
      <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Panic Analysis</div>
      <div class="review-stat-row"><span class="text-muted">Normal change rate</span><span>${(panic.normal_change_rate_per_min ?? 0).toFixed(2)}/min</span></div>
      <div class="review-stat-row"><span class="text-muted">Panic-window change rate</span><span style="color:${panic.detected?'var(--red)':'var(--text)'}">${(panic.panic_change_rate_per_min ?? 0).toFixed(2)}/min</span></div>
      <div class="review-stat-row"><span class="text-muted">Correct → wrong flips</span><span>${panic.correct_changed_to_wrong||0}</span></div>
      <div class="review-stat-row"><span class="text-muted">Marks lost to panic</span><span style="color:var(--red)">${(panic.marks_lost_to_panic||0).toFixed(1)}</span></div>
      <div class="text-xs mt-2" style="color:${panic.detected?'var(--red)':'var(--muted)'}">${panic.detected ? 'Panic behavior detected in the final stretch of this test.' : 'No panic pattern detected.'}</div>
    </div>
  </div>
  <div class="card mb-2">
    <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Skip Pattern</div>
    ${skipGroups.map(g => `

// TAB 4 — RANK LEAKAGE DETAIL
function buildReviewTab4(r) {
  const s = r.session;
  const leakage = s.leakage_report_json || {};
  const breakdown = leakage.breakdown || {};
  const qrs = r.question_results || [];
  const twin = state.twin || {};
  const preds = twin.predictions || {};
  let marksPerRank = null;
  if (preds.rank_range_low && preds.rank_range_high && preds.score_range_low != null &&
      preds.score_range_high != null && preds.score_range_high !== preds.score_range_low) {
    marksPerRank = (preds.rank_range_high - preds.rank_range_low) / (preds.score_range_high - preds.score_range_low);
  }
  const expandedKey = (t) => 'leak_'+t;
  const entries = Object.entries(breakdown).sort((a,b) => b[1].marks - a[1].marks);

  return `
  <div class="card mb-2">
    <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Full Leakage Breakdown</div>
    <div class="review-stat-row"><span class="text-muted">Actual score</span><span>${leakage.actual_score}</span></div>
    <div class="review-stat-row"><span class="text-muted">Potential score</span><span style="color:var(--brand2)">${leakage.potential_score}</span></div>
    <div class="review-stat-row"><span class="text-muted">Marks lost to wrong answers</span><span style="color:var(--red)">${leakage.total_leaked_from_wrong}</span></div>
    <div class="review-stat-row"><span class="text-muted">Opportunity cost from skips</span><span style="color:var(--amber)">${leakage.total_opportunity_cost_from_skipped}</span></div>
    ${leakage.fix_this_first ? `<div class="mt-2" style="padding:.75rem;background:var(--brand-glow);border:1px solid var(--brand);border-radius:8px"><div class="text-xs font-bold" style="color:var(--brand2)">🎯 Fix This First</div><div class="text-sm">${esc(leakage.fix_this_first)}</div></div>` : ''}
  </div>
  <div style="display:flex;flex-direction:column;gap:.75rem">
    ${entries.length ? entries.map(([mtype,data]) => {
      const label = MISTAKE_TYPE_LABELS[mtype] || mtype;
      const contributingQs = qrs.filter(q => q.classified_mistake_type === mtype && (q.is_skipped || !q.is_correct));
      const expanded = state.reviewExpanded[expandedKey(mtype)];
      const rankNote = marksPerRank ? ` = rank improves by ~${Math.round(data.marks*marksPerRank).toLocaleString()}` : '';
      return `
      <div class="card-sm" style="cursor:pointer" onclick="toggleReviewRow('${expandedKey(mtype)}')">
        <div class="flex items-center gap-2">
          <span class="tag" style="background:var(--surface2)">${esc(label)}</span>
          <span class="text-sm font-bold" style="margin-left:auto">${data.marks} marks · ${data.count}Q</span>
        </div>
        <div class="text-xs text-muted mt-1">If you fix ${esc(label).toLowerCase()} errors: +${data.marks} marks${rankNote}</div>
        ${expanded ? `
          <div class="mt-2" style="display:flex;flex-direction:column;gap:.4rem">
            ${contributingQs.map(q => `<div class="text-xs" style="padding:.4rem .6rem;background:var(--surface2);border-radius:6px">${esc((q.question_text||'').substring(0,90))}${(q.question_text||'').length>90?'…':''}</div>`).join('')}
          </div>
        ` : ''}
      </div>`;
    }).join('') : '<div class="empty-state"><div class="em">✓</div><p>No leakage recorded for this test.</p></div>'}
  </div>`;
}

// ── PERFORMANCE ───────────────────────────────────────────────────────────────
function buildPerformance() {
  const perf = state.data.performance || [];
  const bySubject = {};
  perf.forEach(p => { if(!bySubject[p.subject_name]) bySubject[p.subject_name]={color:p.color,items:[]}; bySubject[p.subject_name].items.push(p); });

  // Determine available subjects in a fixed sensible order: Physics first,
  // then Chemistry, then Mathematics/Biology (whichever exists for this exam_target)
  const subjectOrder = ['Physics', 'Chemistry', 'Mathematics', 'Biology'];
  const availableSubjects = subjectOrder.filter(s => bySubject[s]);
  // Fallback: any subject names not in our known order (safety net)
  Object.keys(bySubject).forEach(s => { if (!availableSubjects.includes(s)) availableSubjects.push(s); });

  // Default to Physics if present, else first available subject
  if (!state.heatmapSubject || !availableSubjects.includes(state.heatmapSubject)) {
    state.heatmapSubject = availableSubjects.includes('Physics') ? 'Physics' : (availableSubjects[0] || null);
  }
  const activeSubject = state.heatmapSubject;

  const tabBar = `
  <div class="flex items-center gap-1 mb-2">
    <button class="btn ${state.perfTab==='heatmap'?'btn-primary':'btn-ghost'} btn-sm" onclick="setPerfTab('heatmap')">Overview</button>
    <button class="btn ${state.perfTab==='trends'?'btn-primary':'btn-ghost'} btn-sm" onclick="setPerfTab('trends')">📈 Trends</button>
  </div>`;

  if (state.perfTab === 'trends') {
    return tabBar + buildPerformanceTrends();
  }

  return `
  ${tabBar}
  <div class="card mb-2">
    <div class="section-title mb-2">Chapter-wise Performance</div>
    ${Object.entries(bySubject).length ? Object.entries(bySubject).map(([sub,{color,items}])=>`
      <div class="mb-2">
        <div style="font-size:.8rem;font-weight:700;color:${color};margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.05em">${esc(sub)}</div>
        <div style="display:flex;flex-direction:column;gap:.4rem">
          ${items.map(i=>{const pct=Math.round(i.accuracy*100); return `
            <div class="flex items-center gap-2">
              <div style="width:140px;font-size:.8rem;color:var(--muted);truncate" title="${esc(i.chapter_name)}">${esc(i.chapter_name).substring(0,18)}</div>
              <div class="progress-bar" style="flex:1">
                <div class="progress-fill" style="width:${pct}%;background:${pct<40?'var(--red)':pct<65?'var(--amber)':'var(--green)'}"></div>
              </div>
              <div style="width:40px;text-align:right;font-size:.8rem;font-weight:700;color:${pct<40?'var(--red)':pct<65?'var(--amber)':'var(--green)'}">${pct}%</div>
              <div class="text-xs text-muted" style="width:60px">${i.total_attempted}Q</div>
            </div>`}).join('')}
        </div>
      </div>
    `).join('') : '<div class="empty-state"><div class="em">📈</div><p>Add test results to see performance by chapter</p></div>'}
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;flex-wrap:wrap;gap:.5rem">
      <div class="section-title" style="margin:0">Performance Heatmap</div>
      ${availableSubjects.length > 1 ? `
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          ${availableSubjects.map(sub => `
            <button class="btn ${activeSubject===sub?'btn-primary':'btn-ghost'} btn-sm"
                    onclick="setHeatmapSubject('${esc(sub)}')">${esc(sub)}</button>
          `).join('')}
        </div>
      ` : ''}
    </div>
    ${activeSubject && bySubject[activeSubject]?.items?.length ? `
      <div class="chart-wrap-tall"><canvas id="perfChart"></canvas></div>
    ` : `<div class="empty-state"><div class="em">📊</div><p>No test data yet for ${esc(activeSubject||'this subject')}</p></div>`}
  </div>`;
}

window.setHeatmapSubject = function(sub) {
  state.heatmapSubject = sub;
  render();
};

window.setPerfTab = function(tab) {

function buildPerformanceTrends() {
  const t = state.data.trends;
  if (!t) return `<div class="empty-state"><div class="em">📈</div><p>Loading trends…</p></div>`;
  if (!t.sufficient_data) {
    return `<div class="empty-state"><div class="em">📈</div><p>Complete at least 2 analyzed tests to see trends (you have ${t.sessions_analyzed}).</p>
      <button class="btn btn-primary mt-2" onclick="navigate('library')">Browse Test Library →</button></div>`;
  }

  const chapterRows = t.chapter_mastery_evolution || [];
  const trendArrow = (trend) => trend==='improving' ? {sym:'↑',color:'var(--green)'} : trend==='declining' ? {sym:'↓',color:'var(--red)'} : {sym:'→',color:'var(--muted)'};
  const panicFreq = t.panic_frequency || {};
  const behavioral = t.behavioral_improvements || [];
  const avgSecondGuess = behavioral.length ? (behavioral.reduce((a,b)=>a+(b.avg_answer_changes_per_question||0),0) / behavioral.length).toFixed(2) : '0.00';

  return `
  <div class="grid-2 mb-2">
    <div class="card">
      <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Score Trend</div>
      <div class="chart-wrap"><canvas id="trendScoreChart"></canvas></div>
    </div>
    <div class="card">
      <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Leakage Trend <span class="text-muted" style="font-weight:400;text-transform:none">(declining = improving)</span></div>
      <div class="chart-wrap"><canvas id="trendLeakageChart"></canvas></div>
    </div>
  </div>
  <div class="card mb-2">
    <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Mistake Evolution <span class="text-muted" style="font-weight:400;text-transform:none">(conceptual % declining = improving)</span></div>
    <div class="chart-wrap-tall"><canvas id="trendMistakeChart"></canvas></div>
  </div>
  <div class="card mb-2">
    <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Chapter Mastery Evolution</div>
    <table class="table">
      <thead><tr><th>Chapter</th><th>Tests</th><th>Latest Accuracy</th><th>Trend</th></tr></thead>
      <tbody>
        ${chapterRows.map(c => {
          const points = c.points.filter(p => p.accuracy !== null);
          const latest = points.length ? points[points.length-1].accuracy : null;
          const arrow = trendArrow(c.trend);
          return `<tr>
            <td>${esc(c.chapter_name)}</td>
            <td>${c.points.length}</td>
            <td>${latest !== null ? latest+'%' : '—'}</td>
            <td style="color:${arrow.color};font-weight:700">${arrow.sym} ${esc(c.trend)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  <div class="card">
    <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;letter-spacing:.05em">Behavioral Improvements</div>
    <div class="grid-2">
      <div class="review-stat-row"><span class="text-muted">Panic frequency</span><span>${panicFreq.tests_with_panic||0} / ${panicFreq.total_tests||0} tests (${Math.round((panicFreq.rate||0)*100)}%)</span></div>
      <div class="review-stat-row"><span class="text-muted">Avg answer changes / question</span><span>${avgSecondGuess}</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:.4rem;margin-top:.75rem">
      ${behavioral.map(b => `
        <div class="flex items-center gap-2" style="font-size:.8rem">
          <span style="width:70px;color:var(--muted)">${esc(b.date)}</span>
          <span class="tag" style="background:${b.panic_detected?'#f8717122':'#22d3a022'};color:${b.panic_detected?'var(--red)':'var(--green)'}">${b.panic_detected?'Panic':'Calm'}</span>
          <span class="text-muted">${b.avg_answer_changes_per_question} changes/Q</span>
        </div>
      `).join('')}
    </div>
  </div>`;
}

  // Build revision risk color/label helpers

// Phase 5: Build context-aware banner text from twin data
function getMentorContextBanner() {
  const twin = state.twin;
  const level = (twin && twin.unlock_level) || 1;
  const n = (twin && twin.tests_analyzed) || 0;
  if (!twin || n === 0) {
    return { emoji: '🔒', text: 'Take your first live test to unlock behavioral coaching', cls: 'badge-amber' };
  }
  if (level === 1) {
    const need = 3 - n;
    return { emoji: '🔒', text: `${need > 0 ? need : 0} more test${need !== 1 ? 's' : ''} to unlock behavioral coaching`, cls: 'badge-amber' };
  }
  if (level === 2) {
    const bp = twin.behavioral_patterns || {};
    const md = twin.mistake_distribution || {};
    const topMistake = Object.entries(md).sort((a,b)=>b[1]-a[1])[0];
    const flags = Object.values(bp).filter(v => v && v !== 0 && v !== '').length;
    return { emoji: '🧠', text: `Mentor knows: ${topMistake ? topMistake[0] + ' errors dominant' : 'your test patterns'} • ${flags} behavioral signals active`, cls: 'badge-blue' };
  }
  if (level === 3) {
    const sc = twin.scores || {};
    const er = sc.exam_readiness;
    const n_patterns = Object.keys(twin.topic_mastery || {}).length;
    return { emoji: '🎯', text: `Full profile loaded: ${er != null ? 'readiness ' + er + '%' : 'cognitive profile active'} • ${n_patterns} chapters tracked`, cls: 'badge-green' };
  }
  // Level 4: full predictions
  const pred = twin.predictions || {};
  const on_track = pred.on_track;
  const rl = pred.rank_range_low;
  const rh = pred.rank_range_high;
  const rankText = (rl && rh) ? `Predicted rank ${rl.toLocaleString()}–${rh.toLocaleString()}` : 'Rank prediction active';
  const trackText = on_track === true ? '✓ On track' : on_track === false ? '✗ Behind target' : '';
  if (level >= 4) {
    return { emoji: '⚡', text: `${rankText}${trackText ? ' | ' + trackText : ''}`, cls: on_track === false ? 'badge-red' : 'badge-green' };
  }
}

// Phase 5: Generate contextual suggested prompts based on twin state
function getMentorSuggestedPrompts() {
  const twin = state.twin;
  const level = (twin && twin.unlock_level) || 1;
  const n = (twin && twin.tests_analyzed) || 0;

  if (!twin || n === 0) {
    return [
      "What should I focus on first?",
      `Explain a key ${esc(state.student?.exam_target || 'JEE')} concept`,
      "How do I manage my time in exams?"
    ];
  }

  const bp = twin.behavioral_patterns || {};
  const rls = twin.rank_leakage_summary || {};
  const sc = twin.scores || {};
  const pred = twin.predictions || {};
  const prompts = [];

  // Panic behavior
  if ((bp.panic_fraction || 0) > 0.4) {
    prompts.push("Why do I keep losing marks near the end of the test?");
  }
  // Top leakage source
  const topLeakage = rls.top_leakage_source || '';
  if (topLeakage === 'conceptual') {
    prompts.push("What concept am I missing most?");
  } else if (topLeakage === 'calculation') {
    prompts.push("How do I fix my calculation errors?");
  }
  // Underconfidence
  if ((bp.underconfidence_rate || 0) > 0.3) {
    prompts.push("Am I better than my scores show?");
  }
  // Off track
  if (pred.on_track === false) {
    prompts.push("How far behind am I and what do I do?");
  }
  // Second-guessing
  if ((bp.second_guess_penalty_avg_marks || 0) > 2) {
    prompts.push("Why do I keep changing correct answers to wrong ones?");
  }

  // Fill remaining with smart defaults
  const defaults = [
    "Why isn't my score improving?",
    "What's my biggest weakness right now?",
    "What should I study tomorrow?",
    "How do I improve my time management?"
  ];
  for (const d of defaults) {
    if (prompts.length >= 3) break;
    if (!prompts.includes(d)) prompts.push(d);
  }
  return prompts.slice(0, 3);
}

        color: 'var(--amber)',
        headline: `Got it with a hint`,
        sub: `Next review in ${interval} day${interval !== 1 ? 's' : ''} -- keep practising`,
        motivation: `Ease factor: ${ef} -- a little more exposure needed`,
        holdMs: 4000,
      },
      forgot: {
        emoji: '❌',
        color: 'var(--red)',
        headline: `Forgot -- that's okay`,
        sub: `Resetting to tomorrow (interval = 1)`,
        motivation: `This one needs more reps. SM-2 will drill it harder now`,
        holdMs: 4000,
      },
    };
    const cfg = qualityConfig[quality] || qualityConfig.got_it;

    const efPct = Math.min(100, Math.round(((parseFloat(ef) - 1.3) / (3.5 - 1.3)) * 100));
    const riskBg = `${riskColor[newRisk]}22`;
    const riskBorder = `${riskColor[newRisk]}55`;

    card.innerHTML = `
      <div style="animation:fadeInSlide .18s ease;padding:.1rem 0">
        <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem">
          <span style="font-size:1.5rem;line-height:1">${cfg.emoji}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:.88rem;color:${cfg.color};line-height:1.2">${cfg.headline}</div>
            <div style="font-size:.75rem;color:var(--muted);margin-top:.1rem">${cfg.sub}</div>
          </div>
          <span class="tag" style="background:${riskBg};color:${riskColor[newRisk]};border:1px solid ${riskBorder};font-size:.62rem;white-space:nowrap">
            ${riskLabel[newRisk]} risk
          </span>
        </div>
        <div style="display:flex;gap:.35rem;align-items:center;margin-bottom:.45rem">
          <span class="tag badge-muted" style="font-size:.62rem">Rep #${rep}</span>
          <span class="tag badge-muted" style="font-size:.62rem">EF ${ef}</span>
          <span class="tag badge-muted" style="font-size:.62rem">+${interval}d</span>
        </div>
        <div style="height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:.4rem">
          <div style="height:100%;width:${efPct}%;background:${cfg.color};border-radius:99px;transition:width .6s ease"></div>
        </div>
        <div style="font-size:.7rem;color:var(--muted);font-style:italic">${cfg.motivation}</div>
      </div>`;

    card.style.borderLeftColor = riskColor[newRisk] || 'var(--amber)';
    card.style.transition = 'opacity .35s ease, max-height .35s ease, margin-bottom .35s ease, padding .35s ease';

    // Dynamic hold -- longer for 'forgot' so student can process it
    await new Promise(r => setTimeout(r, cfg.holdMs));

    card.style.opacity = '0';
    card.style.maxHeight = '0';
    card.style.overflow = 'hidden';
    card.style.marginBottom = '0';
    card.style.paddingTop = '0';
    card.style.paddingBottom = '0';

    await new Promise(r => setTimeout(r, 380));

    const r2 = await fetch(`${API}/api/revision/${sid}`);
    const due = r2.ok ? await r2.json() : [];
    state.data.revisionDue = due;

    const todayStr = new Date().toISOString().split('T')[0];
    const overdueCount = due.filter(item => item.due_date < todayStr).length;
    updateRevisionBadge(overdueCount);

    const revList = document.getElementById('revision-list');
    if (revList) {
      const riskLabelFull = {critical:'🔴 Critical',high:'🟠 High',medium:'🟡 Medium',low:'🟢 Low'};
      if (due.length === 0) {
        revList.innerHTML = `<div class="empty-state" style="padding:1.25rem 0">
          <div class="em">🎉</div>
          <p class="text-sm font-bold" style="color:var(--green)">All done for today!</p>
          <p class="text-xs text-muted">Spaced repetition is working. Check back tomorrow.</p>
        </div>`;
      } else {
        revList.innerHTML = due.map(item => `
          <div class="card-sm" id="rev-card-${item.id}"
               style="border-left:3px solid ${riskColor[item.forgetting_risk]||'var(--amber)'};margin-bottom:.5rem">
            <div style="display:flex;align-items:flex-start;gap:.75rem">
              <div style="flex:1;min-width:0">
                <div class="text-sm font-bold" style="margin-bottom:.15rem">${esc(item.chapter_name)}</div>
                <div class="text-xs text-muted" style="margin-bottom:.35rem">${esc((item.description||'').slice(0,80))}${item.description&&item.description.length>80?'…':''}</div>
                <div style="display:flex;gap:.4rem;flex-wrap:wrap;align-items:center">
                  <span class="tag" style="background:${riskColor[item.forgetting_risk]||'var(--amber)'}22;
                    color:${riskColor[item.forgetting_risk]||'var(--amber)'};
                    border:1px solid ${riskColor[item.forgetting_risk]||'var(--amber)'}44;font-size:.65rem">
                    ${riskLabelFull[item.forgetting_risk]||item.forgetting_risk}
                  </span>
                  <span class="tag badge-muted text-xs">Every ${item.interval_days}d</span>
                  <span class="tag badge-muted text-xs">Rep #${item.repetition_count+1}</span>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:.3rem;align-items:flex-end">
                <button class="btn btn-green btn-sm" onclick="reviewRevision(${item.id},'got_it')">✅ Got It</button>
                <button class="btn btn-sm" style="background:var(--amber);color:#000"
                        onclick="reviewRevision(${item.id},'with_hint')">💡 With Hint</button>
                <button class="btn btn-sm" style="background:var(--red)"
                        onclick="reviewRevision(${item.id},'forgot')">❌ Forgot</button>
              </div>
            </div>
          </div>`).join('');
      }
      const headerTag = revList.closest('.card')?.querySelector('[class*="badge-"]');
      if (headerTag && headerTag.textContent.includes('item')) {
        headerTag.textContent = `${due.length} item${due.length!==1?'s':''}`;
        headerTag.className = `tag ${due.length>0?'badge-red':'badge-green'}`;
      }
    }
  } catch(e) {
    if (card) { card.style.opacity='1'; card.querySelectorAll('button').forEach(b=>b.disabled=false); }
    console.error('Review failed:', e);
  }
};

function updateRevisionBadge(count) {
  const badge = document.getElementById('nav-revision-badge');
  if (badge) {
    badge.textContent = count > 0 ? count : '';
    badge.style.display = count > 0 ? 'inline-flex' : 'none';
  }
}

// Load revision count for badge on startup / page switch
// Uses raw fetch (not api()) so a missing table or server error never shows an alert
async function loadRevisionCount() {
  if (!state.student) return;
  try {
    const r = await fetch(`${API}/api/revision/${state.student.id}`);
    const due = r.ok ? await r.json() : [];
    state.data.revisionDue = due || [];
    // Badge shows OVERDUE count: items where due_date < today (strictly past)
    // Items due exactly today are shown in the planner but don't red-badge the nav
    const todayStr = new Date().toISOString().split('T')[0];
    const overdueCount = (due || []).filter(item => item.due_date < todayStr).length;
    updateRevisionBadge(overdueCount);
  } catch(e) {
    // Revision is non-critical — never block the app over it
    state.data.revisionDue = [];
  }
}

// Wire up prefillChatMessage (set by askMentorWith) after render
function attachPrefill() {
  if (state.prefillChatMessage && state.page === 'chat') {
    const el = document.getElementById('chat-input');
    if (el) { el.value = state.prefillChatMessage; state.prefillChatMessage = null; el.focus(); }

window.sendChat = async function() {
  const input=document.getElementById('chat-input'); if(!input)return;
  const msg=input.value.trim(); if(!msg||state.chatLoading)return;
  input.value='';
  state.chatMessages.push({role:'user',content:msg});
  state.chatLoading=true;
  render();
  scrollChat();
  const r=await post('/api/chat',{student_id:state.student.id,message:msg});
  state.chatMessages.push({role:'assistant',content:r?.reply||'Sorry, I could not respond. Make sure the server is running.'});
  state.chatLoading=false;
  render();
  scrollChat();
};

function scrollChat() {
  setTimeout(()=>{const el=document.getElementById('chat-msgs');if(el)el.scrollTop=el.scrollHeight;},50);
}

function buildLockCard(requiredLevel, currentTests, featureName) {
  const needed = {2: 3, 3: 6, 4: 10}[requiredLevel] || requiredLevel;
  const more = Math.max(0, needed - currentTests);
  const total = needed;
  const done = Math.min(currentTests, total);
  const pips = Array.from({length: total}, (_, i) =>
    `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;margin:0 2px;background:${i < done ? 'var(--brand2)' : 'var(--border)'};vertical-align:middle;"></span>`
  ).join('');
  return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:1.5rem;text-align:center;color:var(--text2);">
    <div style="font-size:1.5rem;margin-bottom:.5rem">🔒</div>
    <div style="font-weight:600;color:var(--text1);margin-bottom:.25rem">${featureName}</div>
    <div style="font-size:.875rem;margin-bottom:.75rem">Take ${more} more test${more !== 1 ? 's' : ''} to unlock</div>
    <div>${pips}</div>
  </div>`;
}

function getTwinUnlockLevel() {

function getTwinTestCount() {

// Build Twin summary card for use on Dashboard
function buildTwinSummaryCard() {
  const twin = state.twin;
  if (!twin || !twin.tests_analyzed) return '';
  const level = twin.unlock_level || 1;
  const n = twin.tests_analyzed || 0;
  const action = twin.todays_highest_impact_action || '';
  const sc = twin.scores || {};
  const bp = twin.behavioral_patterns || {};
  const rls = twin.rank_leakage_summary || {};

  let html = `<div style="background:linear-gradient(135deg,#1e1b4b,#0f172a);border:1px solid #4c1d95;border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;">
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;">
      <span style="font-size:1.25rem">🧠</span>
      <span style="font-weight:700;color:#c4b5fd;font-size:1rem">Digital Twin — Level ${level}/4</span>
      <span style="margin-left:auto;font-size:.75rem;color:#8b5cf6;background:#1e1b4b;padding:.25rem .6rem;border-radius:20px;border:1px solid #4c1d95">${n} test${n !== 1 ? 's' : ''} analyzed</span>
    </div>`;

  if (action) {
    html += `<div style="background:#0f172a;border-left:3px solid #7c3aed;padding:.75rem 1rem;border-radius:0 8px 8px 0;margin-bottom:1rem;">
      <div style="font-size:.7rem;color:#8b5cf6;font-weight:600;margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em">⚡ TODAY'S HIGHEST IMPACT ACTION</div>
      <div style="color:#e2e8f0;font-size:.875rem;line-height:1.5">${esc(action)}</div>
    </div>`;
  }

  if (level >= 2) {
    const leak = rls.avg_leaked_per_test || 0;
    const topSrc = rls.top_leakage_source || '—';
    const panic = bp.panic_fraction ? (bp.panic_fraction * 100).toFixed(0) + '%' : 'none';
    html += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:.75rem;">
      <div style="background:#0f172a;border-radius:8px;padding:.75rem;text-align:center;">
        <div style="font-size:.7rem;color:#8b5cf6;margin-bottom:.25rem">AVG LEAKED/TEST</div>
        <div style="font-size:1.25rem;font-weight:700;color:#f87171">${leak.toFixed(1)}</div>
        <div style="font-size:.65rem;color:#64748b">marks</div>
      </div>
      <div style="background:#0f172a;border-radius:8px;padding:.75rem;text-align:center;">
        <div style="font-size:.7rem;color:#8b5cf6;margin-bottom:.25rem">TOP LEAKAGE</div>
        <div style="font-size:.9rem;font-weight:700;color:#fbbf24;text-transform:capitalize">${esc(topSrc)}</div>
      </div>
      <div style="background:#0f172a;border-radius:8px;padding:.75rem;text-align:center;">
        <div style="font-size:.7rem;color:#8b5cf6;margin-bottom:.25rem">PANIC RATE</div>
        <div style="font-size:1.25rem;font-weight:700;color:${bp.panic_fraction > 0.4 ? '#f87171' : '#22d3a0'}">${panic}</div>
      </div>
    </div>`;
  }

  if (level >= 3 && sc.exam_readiness !== null && sc.exam_readiness !== undefined) {
    const er = sc.exam_readiness;
    const erColor = er >= 70 ? '#22d3a0' : er >= 50 ? '#fbbf24' : '#f87171';
    html += `<div style="display:flex;align-items:center;gap:.75rem;">
      <div style="flex:1;background:#0f172a;border-radius:8px;padding:.5rem .75rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem;">
          <span style="font-size:.75rem;color:#94a3b8">Exam Readiness</span>
          <span style="font-weight:700;color:${erColor}">${er}/100</span>
        </div>
        <div style="background:#1e293b;border-radius:4px;height:6px;">
          <div style="height:6px;border-radius:4px;background:${erColor};width:${er}%;transition:width .6s"></div>
        </div>
      </div>
    </div>`;
  }

  if (level < 4) {
    const needed = level < 2 ? 3 : level < 3 ? 6 : 10;
    const more = Math.max(0, needed - n);
    html += `<div style="margin-top:.75rem;font-size:.75rem;color:#64748b;text-align:center">
      ${more > 0 ? `🔒 ${more} more test${more !== 1 ? 's' : ''} to unlock Level ${level + 1} features` : ''}
    </div>`;
  }

  html += `</div>`;
  return html;
}

async function loadPageData() {
  if(!state.student) return;
  const sid = state.student.id;
  const exam = state.student.exam_target;

  if(!state.chapters.length) {
    const [chapters, subjects] = await Promise.all([
      api(`/api/chapters?exam_target=${exam}`),
      api(`/api/subjects?exam_target=${exam}`)
    ]);
    state.chapters = chapters || [];
    state.subjects = subjects || [];
  }

  switch(state.page) {
    case 'rankintel':
      state.data.rankIntel = await api(`/api/students/${sid}/rank-intel`);
      break;
    case 'dashboard':
      const [dash, recs] = await Promise.all([api(`/api/dashboard/${sid}`), api(`/api/recommendations/${sid}`)]);
      state.data.dashboard = dash;
      state.data.recommendations = recs;
      break;
    case 'library':
      const templates = await api(`/api/templates?exam_target=${exam}`) || [];
      // Fetch each template's question list once to build the difficulty
      // distribution bar shown on its card; cached on the template object.
      await Promise.all(templates.map(async t => {
        const detail = await api(`/api/templates/${t.id}`);
        if (detail && detail.questions) {
          const dist = {easy:0, medium:0, hard:0, total:0};
          detail.questions.forEach(q => { if(dist[q.difficulty]!==undefined){dist[q.difficulty]++; dist.total++;} });
          t._difficulty = dist;
        }
      }));
      state.data.templates = templates;
      break;
    case 'study':
      state.data.sessions = await api(`/api/study-sessions/${sid}`);
      break;
    case 'tests':
      const [mockTests, liveSessions] = await Promise.all([
        api(`/api/mock-tests/${sid}`),
        api(`/api/sessions/student/${sid}`),
      ]);
      state.data.tests = mockTests;
      state.data.liveSessions = (liveSessions || []).sort((a,b) =>
        new Date(b.submitted_at || b.started_at) - new Date(a.submitted_at || a.started_at));
      break;
    case 'performance':
      const [perfData, trendsData] = await Promise.all([
        api(`/api/performance/${sid}`),
        api(`/api/students/${sid}/trends`),
      ]);
      state.data.performance = perfData;
      state.data.trends = trendsData;
      break;
    case 'mistakes':
      state.data.mistakes = await api(`/api/mistakes/${sid}`);
      break;
    case 'planner':
      const [plans, revDue] = await Promise.all([
        api(`/api/plan/${sid}`),
        fetch(`${API}/api/revision/${sid}`).then(r => r.ok ? r.json() : []).catch(() => []),
      ]);
      state.data.plans = plans;
      state.data.revisionDue = revDue || [];
      break;
    case 'chat':
      if(!state.chatMessages.length) {
        state.chatMessages = await api(`/api/chat/history/${sid}`) || [];
      }
      break;
  }
}

function attachEvents() {
  setTimeout(()=>{ initCharts(); attachPrefill(); }, 100);
}

function initCharts() {
  if(!window.Chart) return;
  Chart.defaults.color = '#8888aa';
  Chart.defaults.borderColor = '#ffffff0f';
  Chart.defaults.font.family = "'DM Sans', sans-serif";

  if(state.page==='rankintel') {
    initRankIntelCharts();
  }

  if(state.page==='dashboard') {
    const studyEl = document.getElementById('studyChart');
    if(studyEl && state.data.dashboard) {
      const raw = (state.data.dashboard.study_by_day||[]).reverse();
      new Chart(studyEl, { type:'bar', data:{
        labels: raw.map(r=>r.date?.slice(5)||''),
        datasets:[{label:'Minutes studied',data:raw.map(r=>r.mins),backgroundColor:'#7c6af550',borderColor:'#7c6af5',borderWidth:2,borderRadius:4}]
      }, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}} });
    }
  }

  if(state.page==='tests') {
    const testEl = document.getElementById('testChart');
    if(testEl && state.data.tests?.length) {
      const tests = state.data.tests;
      new Chart(testEl, { type:'line', data:{
        labels: tests.map(t=>t.date?.slice(5)||''),
        datasets:[{label:'Score %',data:tests.map(t=>t.percentage),fill:true,backgroundColor:'#22d3a015',borderColor:'#22d3a0',tension:.4,pointBackgroundColor:'#22d3a0',pointRadius:5}]
      }, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}} });
    }
  }

  if(state.page==='review' && state.reviewData) {
    const flags = state.reviewData.session?.behavioral_flags_json || {};
    const curve = flags.fatigue?.curve || [];
    const alloc = flags.section_allocation || {};

    // Tab 1 + Tab 3 both render a fatigue chart (different canvas ids so both can exist)
    ['reviewFatigueChart', 'reviewFatigueChart2'].forEach(id => {
      const el = document.getElementById(id);
      const key = '_'+id;
      if (window[key]) { window[key].destroy(); window[key] = null; }
      if (el && curve.length) {
        window[key] = new Chart(el, { type:'line', data:{
          labels: curve.map(w => `${w.window_start_mins}-${w.window_end_mins}m`),
          datasets:[{label:'Accuracy %',data:curve.map(w=>w.accuracy),spanGaps:true,fill:true,backgroundColor:'#7c6af518',borderColor:'#7c6af5',tension:.3,pointBackgroundColor:'#7c6af5',pointRadius:4}]
        }, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}} });
      }
    });

    const sectionEl = document.getElementById('reviewSectionChart');
    if (window._reviewSectionChart) { window._reviewSectionChart.destroy(); window._reviewSectionChart = null; }
    if (sectionEl && Object.keys(alloc).length) {
      const names = Object.keys(alloc);
      window._reviewSectionChart = new Chart(sectionEl, { type:'bar', data:{
        labels: names,
        datasets:[
          {label:'Actual mins', data:names.map(n=>alloc[n].actual_mins), backgroundColor:'#7c6af580', borderRadius:4},
          {label:'Optimal mins', data:names.map(n=>alloc[n].optimal_mins), backgroundColor:'#22d3a080', borderRadius:4},
        ]
      }, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}} });
    }
  }

  if(state.page==='performance' && state.perfTab==='trends' && state.data.trends?.sufficient_data) {
    const t = state.data.trends;

    const scoreEl = document.getElementById('trendScoreChart');
    if (window._trendScoreChart) window._trendScoreChart.destroy();
    if (scoreEl) {
      window._trendScoreChart = new Chart(scoreEl, { type:'line', data:{
        labels: t.score_trend.map(p=>p.date?.slice(5)||''),
        datasets:[
          {label:'Score %', data:t.score_trend.map(p=>p.percentage), borderColor:'#22d3a0', backgroundColor:'#22d3a015', fill:true, tension:.3, pointRadius:4},
          {label:'Trend', data:t.score_trendline, borderColor:'#7c6af5', borderDash:[6,4], pointRadius:0, fill:false},
        ]
      }, options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:100}}} });
    }

    const leakEl = document.getElementById('trendLeakageChart');
    if (window._trendLeakageChart) window._trendLeakageChart.destroy();
    if (leakEl) {
      window._trendLeakageChart = new Chart(leakEl, { type:'bar', data:{
        labels: t.leakage_trend.map(p=>p.date?.slice(5)||''),
        datasets:[{label:'Marks leaked', data:t.leakage_trend.map(p=>p.total_leaked), backgroundColor:'#f8717180', borderRadius:4}]
      }, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}} });
    }

    const mistakeEl = document.getElementById('trendMistakeChart');
    if (window._trendMistakeChart) window._trendMistakeChart.destroy();
    if (mistakeEl) {
      const MISTAKE_COLORS = {conceptual:'#f87171',calculation:'#fbbf24',time_pressure:'#a78bfa',guessing:'#94a3b8',careless:'#fb923c',avoidance:'#ef4444',formula_recall:'#60a5fa',misread:'#34d399',unclassified:'#64748b'};
      const types = Object.keys(t.mistake_evolution[0]?.percentages || {});
      window._trendMistakeChart = new Chart(mistakeEl, { type:'line', data:{
        labels: t.mistake_evolution.map(p=>p.date?.slice(5)||''),
        datasets: types.map(type => ({
          label: MISTAKE_TYPE_LABELS[type] || type,
          data: t.mistake_evolution.map(p=>p.percentages[type]||0),
          borderColor: MISTAKE_COLORS[type]||'#94a3b8', backgroundColor:(MISTAKE_COLORS[type]||'#94a3b8')+'40',
          fill:true, tension:.3, pointRadius:2,
        }))
      }, options:{responsive:true,maintainAspectRatio:false,scales:{y:{stacked:true,min:0,max:100},x:{stacked:true}},plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}}} });
    }
  }

  if(state.page==='performance') {
    const perfEl = document.getElementById('perfChart');
    if(perfEl && state.data.performance?.length) {
      // Phase 7 fix: filter chart to the currently selected subject tab
      // (defaults to Physics, set in buildPerformance()/setHeatmapSubject())
      const activeSubject = state.heatmapSubject;
      const subjectPerf = activeSubject
        ? state.data.performance.filter(p => p.subject_name === activeSubject)
        : state.data.performance;
      const perf = subjectPerf.slice(0, 12);
      if (perf.length) {
        new Chart(perfEl, { type:'bar', data:{
          labels: perf.map(p=>p.chapter_name?.substring(0,18)),
          datasets:[{label:'Accuracy %',data:perf.map(p=>Math.round(p.accuracy*100)),backgroundColor:perf.map(p=>p.accuracy<0.4?'#f8717180':p.accuracy<0.65?'#fbbf2480':'#22d3a080'),borderRadius:6}]
        }, options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{min:0,max:100}}} });
      }
    }
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  if(state.student) {
    // Phase 4: load Digital Twin on startup so dashboard shows it immediately
    await loadTwin();
    await loadRevisionCount();  // Phase 7: load revision queue count for nav badge
    await loadPageData();
  }
  render();
}
init();
</script>
